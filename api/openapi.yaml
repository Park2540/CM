        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: no, in: path, required: true, schema: { type: integer }, description: เลขงวด }
        post:
            tags: [projects]
            summary: บันทึกรับชำระเงินงวดงานพร้อมหลักฐาน (ต้องมีสิทธิ์ payment.record)
