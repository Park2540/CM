            operationId: listLicenseAlerts
            parameters:
                - { name: withinDays, in: query, schema: { type: integer, default: 90, minimum: 1 } }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/LicenseAlert' }

    /approvals:
        get:
            tags: [approvals]
            summary: คำขออนุมัติที่ผู้ใช้มีสิทธิ์เห็น (ล่าสุดก่อน)
            operationId: listApprovals
            parameters:
                - { name: status, in: query, schema: { $ref: '#/components/schemas/ApprovalStatus' } }
                - { name: type, in: query, schema: { $ref: '#/components/schemas/ApprovalType' } }
                - { name: projectCode, in: query, schema: { type: string } }
                - { name: q, in: query, description: ค้นหาเลขที่ รายการ ผู้ขอ, schema: { type: string } }
                - name: sort
                  in: query
                  description: '`priority` = รายการที่ต้องให้เจ้าของอนุมัติและยอดสูงก่อน'
                  schema: { type: string, enum: [newest, priority], default: newest }
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ApprovalPage' }

    /approvals/summary:
        get:
            tags: [approvals]
            summary: ตัวเลขสรุป (ใช้กับแถบแจ้งเตือนและการ์ดสรุป)
            operationId: getApprovalSummary
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ApprovalSummary' }

    /approvals/{id}:
        parameters:
            - $ref: '#/components/parameters/ApprovalId'
        get:
            tags: [approvals]
            operationId: getApproval
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Approval' }
                '404': { $ref: '#/components/responses/NotFound' }

    /approvals/{id}/approve:
        parameters:
            - $ref: '#/components/parameters/ApprovalId'
        post:
            tags: [approvals]
            operationId: approveApproval
            requestBody:
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/DecisionInput' }
            responses:
                '200':
                    description: อนุมัติแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Approval' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /approvals/{id}/reject:
        parameters:
            - $ref: '#/components/parameters/ApprovalId'
        post:
            tags: [approvals]
            operationId: rejectApproval
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/RejectInput' }
            responses:
                '200':
                    description: ไม่อนุมัติแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Approval' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /approvals/bulk-approve:
        post:
            tags: [approvals]
            summary: อนุมัติหลายรายการ (รายการที่ทำไม่ได้จะอยู่ใน skipped)
            operationId: bulkApprove
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [ids]
                            properties:
                                ids:
                                    type: array
                                    minItems: 1
                                    items: { type: string }
                                note: { type: string, maxLength: 500 }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/BulkApproveResult' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /audit-logs:
        get:
            tags: [audit]
            summary: บันทึกการกระทำ (ล่าสุดก่อน, อ่านอย่างเดียว)
            operationId: listAuditLogs
            parameters:
                - { name: module, in: query, schema: { $ref: '#/components/schemas/AuditModule' } }
                - { name: userId, in: query, schema: { type: string } }
                - { name: q, in: query, description: ค้นหาการกระทำ รายการ รายละเอียด, schema: { type: string } }
                - { name: from, in: query, schema: { type: string, format: date-time } }
                - { name: to, in: query, schema: { type: string, format: date-time } }
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/AuditLogPage' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /audit-logs/export:
        get:
            tags: [audit]
            summary: ส่งออก CSV ตามตัวกรองเดียวกับ /audit-logs (UTF-8 พร้อม BOM)
            operationId: exportAuditLogs
            parameters:
                - { name: module, in: query, schema: { $ref: '#/components/schemas/AuditModule' } }
                - { name: userId, in: query, schema: { type: string } }
                - { name: q, in: query, schema: { type: string } }
            responses:
                '200':
                    description: ไฟล์ CSV
                    content:
                        text/csv:
                            schema: { type: string }
                '403': { $ref: '#/components/responses/Forbidden' }

    /dashboard/summary:
        get:
            tags: [dashboard]
            summary: กำไร-ขาดทุนรายโครงการและยอดรวมบริษัท (เจ้าของบริษัท)
            operationId: getDashboardSummary
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/DashboardSummary' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /dashboard/projects:
        get:
            tags: [dashboard]
            summary: จำนวนโครงการตามสถานะ (ในมือ เสร็จแล้ว กำลังดำเนินการ รอทำสัญญา อยู่ในประกัน)
            description: inHandValue ส่งเฉพาะผู้มีสิทธิ์ finance.company
            operationId: getProjectPortfolio
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProjectPortfolio' }

    /dashboard/cash-flow:
        get:
            tags: [dashboard]
            summary: เงินรับ-เงินจ่ายรายเดือน (เดือนล่าสุดนับถึงวันนี้)
            operationId: getCashFlow
            parameters:
                - { name: months, in: query, schema: { type: integer, default: 6, minimum: 1, maximum: 24 } }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/MonthlyCashFlow' }
                '403': { $ref: '#/components/responses/Forbidden' }

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        ProjectCode:
            name: code
            in: path
            required: true
            schema: { type: string, examples: [CR690001] }
        ApprovalId:
            name: id
            in: path
            required: true
            schema: { type: string, examples: [PR-6910-0036] }
        Page:
            name: page
            in: query
            description: เริ่มที่ 1
            schema: { type: integer, minimum: 1, default: 1 }
        PageSize:
            name: pageSize
            in: query
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    responses:
        Unauthorized:
            description: ยังไม่ได้ล็อกอินหรือ token หมดอายุ
            content:
                application/problem+json:
                    schema: { $ref: '#/components/schemas/Problem' }
        Forbidden:
            description: บทบาทนี้ไม่มีสิทธิ์
            content:
                application/problem+json:
                    schema: { $ref: '#/components/schemas/Problem' }
        NotFound:
            description: ไม่พบข้อมูล
            content:
                application/problem+json:
                    schema: { $ref: '#/components/schemas/Problem' }
        Conflict:
            description: สถานะข้อมูลเปลี่ยนไปแล้ว เช่น คำขอถูกตัดสินไปก่อนหน้า
            content:
                application/problem+json:
                    schema: { $ref: '#/components/schemas/Problem' }
        ValidationError:
            description: ข้อมูลไม่ถูกต้อง
            content:
                application/problem+json:
                    schema: { $ref: '#/components/schemas/Problem' }

    schemas:
        Problem:
            type: object
            required: [title, status]
            properties:
                type: { type: string, format: uri, default: about:blank }
                title: { type: string, description: ข้อความสั้นสำหรับแสดงผู้ใช้ (ภาษาไทย) }
                status: { type: integer }
                detail: { type: string }
                errors:
                    type: object
                    description: ข้อผิดพลาดรายช่อง (ชื่อช่อง → ข้อความ)
                    additionalProperties: { type: string }

        PageMeta:
            type: object
            required: [page, pageSize, total]
            properties:
                page: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }

        # ---------- ผู้ใช้และสิทธิ์ ----------
        RoleId:
            type: string
            enum: [admin, owner, admin-staff, accounting, procurement, storekeeper, auditor, project-manager, engineer, architect, foreman, safety-officer, subcontractor, client, supplier]
        UserRef:
            type: object
            required: [id, name, roleLabel]
            properties:
                id: { type: string }
                name: { type: string }
                roleLabel: { type: string, description: ชื่อบทบาท ณ เวลาที่เกิดเหตุการณ์ }
        Permission:
            type: string
            description: |
                สิทธิ์ที่หน้าบ้านใช้ตัดสินว่าจะแสดงปุ่ม/ส่วนใด (หลังบ้านต้องตรวจสิทธิ์ซ้ำทุกคำขอ)
                - progress.update: บันทึกความคืบหน้าและผลตรวจ
                - personnel.sensitive: ดู/แก้ข้อมูลอ่อนไหวของบุคลากร
                - finance.company: ดูการเงินระดับบริษัท (Dashboard กำไร-ขาดทุน)
                - approval.any: อนุมัติได้ทุกยอด
                - project.create: เปิดโครงการใหม่
                - project.manage: จัดการโครงการ เช่น บันทึกสัญญาและเริ่มแผนงาน
                - user.manage: จัดการบัญชีผู้ใช้ บทบาท และสิทธิ์ของบุคลากร
                - payment.record: บันทึก/ยกเลิกการรับชำระเงินงวดงานของลูกค้า
                - procurement.manage: จัดซื้อและเช่า: ออกใบสั่งซื้อ รับของ รับ/คืนอุปกรณ์ที่เช่า/ยืม แก้รายการวัสดุ
                - procurement.receive: ตรวจรับของที่หน้างาน รับ/คืนอุปกรณ์เช่า ส่งของเหลือเข้าคลังหลัก/เบิกจากคลัง (ผู้จัดการโครงการ วิศวกร โฟร์แมน เจ้าของบริษัท)
                - estimate.manage: ถอดปริมาณและจัดทำ BOQ/ใบประมาณราคา
            enum: [progress.update, personnel.sensitive, finance.company, approval.any, project.create, project.manage, user.manage, payment.record, procurement.manage, procurement.receive, estimate.manage]
        CurrentUser:
            type: object
            required: [id, name, roleId, roleLabel, projectCodes, email, lastLoginAt, permissions]
            properties:
                id: { type: string }
                name: { type: string }
                roleId: { $ref: '#/components/schemas/RoleId' }
                roleLabel: { type: string }
                projectCodes:
                    type: array
                    description: โครงการที่เป็นสมาชิก (ว่าง = ทุกโครงการสำหรับทีมภายใน)
                    items: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                position: { type: string, description: ตำแหน่งงาน }
                department: { type: string }
                employeeCode: { type: string, description: รหัสบุคลากร (ไม่มีสำหรับบุคคลภายนอก) }
                avatarUrl: { type: string, format: uri }
                lastLoginAt: { type: string, format: date-time, description: เวลาเข้าสู่ระบบครั้งก่อนหน้า }
                permissions:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }
        RoleCatalog:
            type: object
            required: [groups, roles]
            properties:
                groups:
                    type: array
                    items:
                        type: object
                        required: [id, label, scope]
                        properties:
                            id: { type: string, enum: [internal, project, external] }
                            label: { type: string }
                            scope: { type: string }
                roles:
                    type: array
                    items:
                        type: object
                        required: [id, group, label, access, restriction, permissions]
                        properties:
                            id: { $ref: '#/components/schemas/RoleId' }
                            group: { type: string, enum: [internal, project, external] }
                            label: { type: string }
                            access: { type: string }
                            restriction: { type: string }
                            permissions:
                                type: array
                                description: สิทธิ์ตั้งต้นของบทบาท (ปรับรายคนได้ที่บัญชีผู้ใช้)
                                items: { $ref: '#/components/schemas/Permission' }
                            suggested: { type: boolean }
                            optional: { type: boolean }

        LoginInput:
            type: object
            required: [email, password]
            properties:
                email: { type: string }
                password: { type: string, writeOnly: true }
                remember: { type: boolean, default: false, description: จดจำการเข้าสู่ระบบ (token อายุ 30 วัน แทน 8 ชั่วโมง) }
        LoginResult:
            type: object
            required: [accessToken, expiresAt, user]
            properties:
                accessToken: { type: string, description: 'ส่งใน header Authorization: Bearer <token>' }
                expiresAt: { type: string, format: date-time }
                user: { $ref: '#/components/schemas/CurrentUser' }
        RegistrationStatus:
            type: string
            enum: [pending, approved, rejected]
        RegistrationInput:
            type: object
            required: [fullName, email, phone, password]
            properties:
                fullName: { type: string, minLength: 1 }
                email: { type: string, format: email }
                phone: { type: string, description: ตัวเลข 9-10 หลัก ขึ้นต้นด้วย 0 }
                employeeCode: { type: string, description: รหัสบุคลากร (ถ้ามี) ช่วยให้ผู้อนุมัติจับคู่กับทะเบียนบุคลากรได้ }
                position: { type: string, description: ตำแหน่งงานที่แจ้งมา }
                note: { type: string, description: ข้อความถึงผู้อนุมัติ เช่น ทำงานโครงการไหน }
                password: { type: string, minLength: 8, writeOnly: true, description: ใช้ได้หลังได้รับอนุมัติ (หลังบ้านเก็บแบบ hash เท่านั้น) }
        Registration:
            type: object
            required: [id, fullName, email, phone, status, submittedAt]
            properties:
                id: { type: string }
                fullName: { type: string }
                email: { type: string }
                phone: { type: string }
                employeeCode: { type: string }
                position: { type: string }
                note: { type: string }
                status: { $ref: '#/components/schemas/RegistrationStatus' }
                submittedAt: { type: string, format: date-time }
                suggestedPersonnelId: { type: string, description: บุคลากรที่หลังบ้านจับคู่ให้ (จากรหัสบุคลากร อีเมล หรือชื่อ) และยังไม่มีบัญชี }
                decidedAt: { type: string, format: date-time }
                decidedBy: { $ref: '#/components/schemas/UserRef' }
                rejectReason: { type: string }
                accountId: { type: string, description: บัญชีที่สร้างเมื่ออนุมัติ }
        UserAccountStatus:
            type: string
            description: |
                - invited: ส่งคำเชิญแล้ว ยังไม่ได้ตั้งรหัสผ่าน
                - active: ใช้งานได้
                - suspended: ระงับการเข้าสู่ระบบ (เก็บประวัติไว้)
            enum: [invited, active, suspended]
        UserAccountInput:
            type: object
            description: |
                สิทธิ์ที่ใช้จริง = สิทธิ์ตั้งต้นของบทบาท + grantedPermissions − revokedPermissions
                บทบาทกลุ่มทีมประจำโครงการ (project) ต้องระบุ projectCodes อย่างน้อย 1 โครงการ; กลุ่มทีมภายใน (internal) เห็นทุกโครงการ ให้ส่ง projectCodes ว่าง
            required: [email, roleId, projectCodes, grantedPermissions, revokedPermissions]
            properties:
                email: { type: string, format: email, description: อีเมลที่ใช้เข้าสู่ระบบ (ซ้ำกับบัญชีอื่นไม่ได้ 409) }
                roleId: { $ref: '#/components/schemas/RoleId' }
                projectCodes: { type: array, items: { type: string } }
                grantedPermissions:
                    type: array
                    description: สิทธิ์ที่ให้เพิ่มจากบทบาท
                    items: { $ref: '#/components/schemas/Permission' }
                revokedPermissions:
                    type: array
                    description: สิทธิ์ของบทบาทที่ถอนออกสำหรับคนนี้
                    items: { $ref: '#/components/schemas/Permission' }
        UserAccountCreateInput:
            allOf:
                - $ref: '#/components/schemas/UserAccountInput'
                - type: object
                  required: [personnelId]
                  properties:
                      personnelId: { type: string, description: บุคลากรที่ยังไม่มีบัญชี (1 คน 1 บัญชี ซ้ำได้ 409) }
        UserAccount:
            allOf:
                - $ref: '#/components/schemas/UserAccountInput'
                - type: object
                  required: [id, personnelId, name, roleLabel, status, permissions, createdAt]
                  properties:
                      id: { type: string }
                      personnelId: { type: string }
                      name: { type: string, description: ชื่อจากทะเบียนบุคลากร }
                      employeeCode: { type: string }
                      position: { type: string }
                      department: { type: string }
                      phone: { type: string, description: เบอร์โทรจากทะเบียนบุคลากร }
                      roleLabel: { type: string }
                      status: { $ref: '#/components/schemas/UserAccountStatus' }
                      permissions:
                          type: array
                          description: สิทธิ์ที่ใช้จริง (หลังบ้านคำนวณ)
                          items: { $ref: '#/components/schemas/Permission' }
                      createdAt: { type: string, format: date-time }
                      invitedAt: { type: string, format: date-time, description: ส่งคำเชิญหรือลิงก์ตั้งรหัสผ่านล่าสุด }
                      lastLoginAt: { type: string, format: date-time }

        ApprovalSettings:
            type: object
            required: [projectManagerLimit, changeOrderRequiresOwner]
            properties:
                projectManagerLimit: { type: number, minimum: 0, description: วงเงินที่ผู้จัดการโครงการอนุมัติได้ต่อรายการ (บาท) }
                changeOrderRequiresOwner: { type: boolean, description: งานเพิ่ม-ลดต้องให้เจ้าของอนุมัติทุกยอด }

        # ---------- โครงการ ----------
        ProjectRegion:
            type: object
            required: [code, province]
            properties:
                code: { type: string, description: รหัสขึ้นต้นโครงการ, examples: [CR] }
                province: { type: string, examples: [เชียงราย] }
        ProjectInput:
            type: object
            description: ข้อมูลเบื้องต้นตอนเปิดโครงการ (ก่อนเซ็นสัญญา) — มูลค่าและวันที่บันทึกภายหลังที่ POST /projects/{code}/contract
            required: [name, regionCode, customerName, phone, responsibleName]
            properties:
                name: { type: string, minLength: 1, maxLength: 200, description: ชื่อโครงการ (ผู้ใช้ตั้งเอง) }
                regionCode: { type: string, description: จังหวัดที่ตั้งโครงการ ใช้ออกรหัส (GET /settings/project-regions) }
                customerName: { type: string, minLength: 1 }
                phone: { type: string, description: เบอร์โทรลูกค้า 9-10 หลัก }
                customerEmail: { type: string }
                customerLineId: { type: string }
                customerAddress: { type: string, description: ที่อยู่ติดต่อลูกค้า }
                responsibleName: { type: string, minLength: 1, description: ผู้รับผิดชอบโครงการ }
                housePlanName: { type: string, maxLength: 200, description: ชื่อแบบบ้าน (ไม่ส่ง = ระบบตั้งจาก designBrief เช่น "บ้าน 2 ชั้น 3 ห้องนอน (รอออกแบบ)") }
                housePlanCode: { type: string, description: (ระบบเดิม) แบบจากคลังแบบบ้าน — หน้าเปิดโครงการไม่ใช้แล้ว }
                designBrief: { $ref: '#/components/schemas/DesignBrief' }
                requirements: { type: string, maxLength: 2000, description: ความต้องการเพิ่มเติมของลูกค้า }
                siteCoordinates: { $ref: '#/components/schemas/SiteLocationInput', description: พิกัดหน้างาน (ไม่บังคับ) — ระบบปักหมุดให้ตั้งแต่เปิดโครงการ ใช้แสดงแผนที่และนำทาง Google Maps }
        DesignBrief:
            type: object
            description: ความต้องการคร่าว ๆ ของลูกค้า ใช้เป็นโจทย์ออกแบบบ้าน (ทุกช่องไม่บังคับ)
            properties:
                floors: { type: integer, minimum: 1, maximum: 8, description: บ้านพักอาศัยไม่เกิน 3 ชั้น อาคารพาณิชย์ไม่เกิน 8 ชั้น }
                bedrooms: { type: integer, minimum: 0, maximum: 20 }
                bathrooms: { type: integer, minimum: 0, maximum: 20 }
                parking: { type: integer, minimum: 0, maximum: 20, description: ที่จอดรถ (คัน) }
                usableArea: { type: number, minimum: 0, description: พื้นที่ใช้สอยที่ต้องการโดยประมาณ (ตร.ม.) }
                landArea: { type: number, minimum: 0, description: ขนาดที่ดิน (ตร.ว.) }
                budget: { type: number, minimum: 0, description: งบประมาณก่อสร้างที่ตั้งไว้ (บาท) }
                style: { type: string, maxLength: 100, examples: [โมเดิร์น] }
                rooms: { type: array, maxItems: 20, items: { type: string, maxLength: 50 }, description: ห้อง/พื้นที่พิเศษ เช่น ห้องพระ ห้องทำงาน ห้องแม่บ้าน }
        ContractInput:
            type: object
            description: บันทึกเมื่อได้งาน/เซ็นสัญญาแล้ว หลังบ้านจะสร้างแผนงานจากแม่แบบและงวดงาน
            required: [value, signedDate, startDate, deliveryDate, location]
            properties:
                value: { type: number, exclusiveMinimum: 0, description: มูลค่าสัญญา (บาท) }
                signedDate: { type: string, format: date, description: วันที่เซ็นสัญญา (ไม่เกินวันนี้) }
                startDate: { type: string, format: date, description: วันเริ่มงาน (ไม่ก่อนวันเซ็นสัญญา) }
                deliveryDate: { type: string, format: date, description: ต้องห่างจากวันเริ่มอย่างน้อย 30 วัน }
                location: { type: string, minLength: 1, description: ที่ตั้งหน้างาน (เลขที่/ตำบล/อำเภอ) }
                siteCoordinates: { $ref: '#/components/schemas/SiteLocationInput', description: พิกัดหน้างาน (ไม่บังคับ) — ระบบปักหมุดให้เพื่อแสดงแผนที่และนำทาง Google Maps }
        ProjectStatus:
            type: string
            description: pending-contract = เปิดโครงการแล้วแต่ยังไม่ได้บันทึกสัญญา (ยังไม่มีแผนงาน งวดงาน ภาพ เอกสาร)
            enum: [pending-contract, planning, in-progress, near-handover, completed, delayed]
        Project:
            type: object
            required: [code, name, location, housePlanName, customerName, phone, responsibleName, value, startDate, deliveryDate, contractSignedAt, progress, status, createdAt]
            properties:
                code: { type: string, examples: [CR690001] }
                name: { type: string }
                location: { type: [string, 'null'], description: ที่ตั้งหน้างาน (null จนกว่าจะบันทึกสัญญา) }
                siteCoordinates: { $ref: '#/components/schemas/SiteLocation', description: พิกัดหน้างานที่ปักหมุดไว้ (ไม่มี = แผนที่ค้นหาจากที่ตั้งหน้างาน) }
                housePlanName: { type: string }
                housePlanCode: { type: string }
                designBrief: { $ref: '#/components/schemas/DesignBrief' }
                requirements: { type: string }
                customerName: { type: string }
                phone: { type: string }
                customerEmail: { type: string }
                customerLineId: { type: string }
                customerAddress: { type: string }
                responsibleName: { type: string }
                value: { type: [number, 'null'], description: มูลค่าสัญญา (null จนกว่าจะบันทึกสัญญา) }
                startDate: { type: [string, 'null'], format: date }
                deliveryDate: { type: [string, 'null'], format: date }
                contractSignedAt: { type: [string, 'null'], format: date }
                progress: { type: integer, minimum: 0, maximum: 100 }
                status: { $ref: '#/components/schemas/ProjectStatus' }
                createdAt: { type: string, format: date-time, description: วันที่เปิดโครงการ }
                setupConfiguredAt: { type: [string, 'null'], format: date-time, description: เวลาที่ตั้งค่างานก่อสร้าง (null = ยังไม่ตั้งค่า ยังไม่มีไทม์ไลน์) }
                handedOverAt: { type: [string, 'null'], format: date, description: วันที่ส่งมอบงานจริง (null = ยังไม่ส่งมอบ) }
                warrantyUntil: { type: [string, 'null'], format: date, description: วันสิ้นสุดการรับประกันส่วนที่นานที่สุด (งานโครงสร้าง) — ดูแยกส่วนที่ warranties }
                warranties:
                    type: array
                    description: การรับประกันแยกส่วน (งานสถาปัตยกรรม 1 ปี งานโครงสร้าง 5 ปี นับจากวันส่งมอบ) ว่างจนกว่าจะส่งมอบ
                    items: { $ref: '#/components/schemas/WarrantyCoverage' }
                changeOrderTotal: { type: number, description: ยอดสุทธิของงานเพิ่ม-ลดที่อนุมัติแล้ว (บวก = เพิ่ม ลบ = ลด) }
                revisedValue: { type: [number, 'null'], description: มูลค่าสัญญาปัจจุบัน = value + changeOrderTotal (null จนกว่าจะบันทึกสัญญา) }

        SiteLocationInput:
            type: object
            required: [lat, lng]
            properties:
                lat: { type: number, minimum: -90, maximum: 90, examples: [19.9105] }
                lng: { type: number, minimum: -180, maximum: 180, examples: [99.8406] }
        SiteLocation:
            allOf:
                - $ref: '#/components/schemas/SiteLocationInput'
                - type: object
                  required: [updatedBy, updatedAt]
                  properties:
                      updatedBy: { $ref: '#/components/schemas/UserRef' }
                      updatedAt: { type: string, format: date-time }

        ChangeOrderSource:
            type: string
            description: |
                - customer: ลูกค้าขอเพิ่ม/เปลี่ยนงานนอกสัญญา (ต้องให้ลูกค้ายืนยันก่อนอนุมัติ)
                - site: ปรับแก้ระหว่างก่อสร้างตามสภาพหน้างาน
                - design: แก้แบบ/เปลี่ยนวัสดุตามผู้ออกแบบ
            enum: [customer, site, design]
        ChangeOrderStatus:
            type: string
            description: pending = รออนุมัติ, approved = อนุมัติแล้ว (ปรับมูลค่า/ไทม์ไลน์แล้ว), rejected = ไม่อนุมัติ, cancelled = ผู้ขอยกเลิก
            enum: [pending, approved, rejected, cancelled]
        ChangeOrderItem:
            type: object
            required: [name, kind, quantity, unit, unitPrice]
            properties:
                name: { type: string, minLength: 1 }
                kind: { type: string, enum: [add, deduct], description: 'add = งานเพิ่ม (บวกมูลค่า), deduct = งานลด (หักมูลค่า)' }
                quantity: { type: number, exclusiveMinimum: 0 }
                unit: { type: string, minLength: 1 }
                unitPrice: { type: number, minimum: 0 }
        ChangeOrderInput:
            type: object
            required: [title, source, reason, items, scheduleImpactDays, customerConfirmed]
            properties:
                title: { type: string, minLength: 1 }
                source: { $ref: '#/components/schemas/ChangeOrderSource' }
                reason: { type: string, minLength: 1, description: เหตุผล/รายละเอียดที่ขอเปลี่ยน }
                items:
                    type: array
                    minItems: 1
                    items: { $ref: '#/components/schemas/ChangeOrderItem' }
                scheduleImpactDays: { type: integer, minimum: -60, maximum: 365, description: เลื่อนกำหนดส่งมอบ (วัน) เมื่ออนุมัติ — ลบ = เร็วขึ้น }
                newTask:
                    type: object
                    description: เพิ่มงานเข้าไทม์ไลน์เมื่ออนุมัติ (ติดตามความคืบหน้าได้เหมือนงานอื่น)
                    required: [phaseCode, name, durationDays]
                    properties:
                        phaseCode: { type: string }
                        name: { type: string, minLength: 1 }
                        durationDays: { type: integer, minimum: 1, maximum: 120 }
                customerConfirmed: { type: boolean, description: ลูกค้ายืนยันรายการและราคาแล้ว (เช่น ลงนามใบเสนอราคางานเพิ่ม) }
        ChangeOrder:
            allOf:
                - $ref: '#/components/schemas/ChangeOrderInput'
                - type: object
                  required: [id, projectCode, status, addTotal, deductTotal, total, requestedBy, requestedAt, approvalId]
                  properties:
                      id: { type: string, examples: [CO-CR690002-01] }
                      projectCode: { type: string }
                      status: { $ref: '#/components/schemas/ChangeOrderStatus' }
                      addTotal: { type: number }
                      deductTotal: { type: number }
                      total: { type: number, description: ยอดสุทธิ = addTotal − deductTotal }
                      requestedBy: { $ref: '#/components/schemas/UserRef' }
                      requestedAt: { type: string, format: date-time }
                      approvalId: { type: string, description: 'คำขออนุมัติในศูนย์อนุมัติ (อนุมัติ/ไม่อนุมัติผ่าน /approvals/{approvalId})' }
                      customerConfirmedAt: { type: string, format: date-time }
                      decidedAt: { type: string, format: date-time }
                      decidedBy: { $ref: '#/components/schemas/UserRef' }
                      decisionNote: { type: string }
                      appliedTaskCode: { type: string, description: รหัสงานที่เพิ่มเข้าไทม์ไลน์เมื่ออนุมัติ }
                      deliveryDateBefore: { type: string, format: date }
                      deliveryDateAfter: { type: string, format: date }

        # ---------- จัดซื้อวัสดุและเช่า/ยืมอุปกรณ์ (รายโครงการ) ----------
        ProcurementItem:
            type: object
            required: [name, quantity, unit, unitPrice]
            properties:
                materialCode: { type: string, description: รหัสในรายการวัสดุ (ถ้าเลือกจากรายการ) ใช้เทียบกับ BOQ }
                name: { type: string, minLength: 1, maxLength: 200 }
                quantity: { type: number, exclusiveMinimum: 0 }
                unit: { type: string, minLength: 1, maxLength: 30 }
                unitPrice: { type: number, minimum: 0, description: ราคาต่อหน่วยโดยประมาณ (บาท) }
        PurchaseStatus:
            type: string
            description: |
                pending = ใบขอซื้อรออนุมัติ, approved = อนุมัติแล้ว รอออกใบสั่งซื้อ (หรือใบสั่งซื้อไม่ผ่านอนุมัติ ออกใหม่ได้), rejected = ไม่อนุมัติ,
                po-pending = ใบสั่งซื้อรออนุมัติ, ordered = ใบสั่งซื้ออนุมัติแล้ว รอรับของ, partial = รับของบางส่วน, received = รับครบ, cancelled = ยกเลิก
            enum: [pending, approved, rejected, po-pending, ordered, partial, received, cancelled]
        PurchaseRequestInput:
            type: object
            required: [title, items, neededDate]
            properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/ProcurementItem' } }
                neededDate: { type: string, format: date, description: วันที่ต้องการใช้ที่หน้างาน }
                phaseCode: { type: string, description: ขั้นตอนในไทม์ไลน์ที่ใช้วัสดุนี้ (ถ้ามี) }
                supplier: { type: string, maxLength: 200, description: ร้านค้าที่เสนอ (ถ้ามี) }
                note: { type: string, maxLength: 1000 }
        Vendor:
            type: object
            required: [name]
            properties:
                name: { type: string, minLength: 1, maxLength: 200, description: ชื่อร้าน/บริษัทผู้ขาย }
                taxId: { type: string, maxLength: 20, description: เลขประจำตัวผู้เสียภาษี }
                address: { type: string, maxLength: 500 }
                contactName: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 30 }
        PurchaseOrderInput:
            type: object
            description: ออกใบสั่งซื้อจากใบขอซื้อที่อนุมัติแล้ว (ราคาจากใบเสนอราคาที่ดีที่สุด รวม VAT แล้ว) — ส่งเข้าศูนย์อนุมัติเป็น po ด้วยวงเงินเดียวกับใบขอซื้อ
            required: [vendor, orderDate, unitPrices]
            properties:
                vendor: { $ref: '#/components/schemas/Vendor' }
                orderDate: { type: string, format: date }
                expectedDate: { type: string, format: date, description: วันที่ร้านจะส่งของถึงหน้างาน }
                unitPrices: { type: array, maxItems: 50, items: { type: number, minimum: 0 }, description: ราคาต่อหน่วยรวม VAT เรียงตาม items ของใบขอซื้อ }
                paymentTerms: { type: string, maxLength: 200, examples: [เครดิต 30 วัน] }
                note: { type: string, maxLength: 1000 }
                quotationFileIds: { type: array, maxItems: 10, items: { type: string }, description: ใบเสนอราคาที่เลือก (id จาก POST /uploads) }
        PurchaseOrder:
            type: object
            required: [poNumber, status, supplier, orderDate, orderedBy]
            properties:
                poNumber: { type: string, examples: [PO-6910-0008], description: เลขใบสั่งซื้อ = เลขคำขอในศูนย์อนุมัติ }
                approvalId: { type: string }
                status: { type: string, enum: [pending, approved, rejected], description: ผลอนุมัติใบสั่งซื้อ }
                vendor: { $ref: '#/components/schemas/Vendor' }
                supplier: { type: string, description: ชื่อผู้ขาย (= vendor.name) }
                orderDate: { type: string, format: date }
                expectedDate: { type: string, format: date }
                unitPrices: { type: array, items: { type: number }, description: ราคาต่อหน่วยรวม VAT }
                amount: { type: number, description: ยอดรวม VAT }
                amountBeforeVat: { type: number }
                vatAmount: { type: number, description: VAT 7% ที่รวมอยู่ในยอด }
                paymentTerms: { type: string }
                note: { type: string }
                quotationFiles: { type: array, items: { $ref: '#/components/schemas/UploadedFile' } }
                orderedBy: { $ref: '#/components/schemas/UserRef' }
                orderedAt: { type: string, format: date-time }
                decidedAt: { type: string, format: date-time }
                decisionNote: { type: string }
        PurchaseReceiveInput:
            type: object
            required: [date, quantities]
            properties:
                date: { type: string, format: date, description: วันที่รับของ (ไม่เกินวันนี้) }
                quantities: { type: array, maxItems: 50, items: { type: number, minimum: 0 }, description: จำนวนที่รับครั้งนี้ เรียงตาม items (0 = ไม่ได้รับ) รวมกับที่รับแล้วต้องไม่เกินจำนวนที่ขอ }
                note: { type: string, maxLength: 1000 }
                fileIds: { type: array, maxItems: 10, items: { type: string }, description: ใบส่งของ / รูปถ่ายของที่รับ (id จาก POST /uploads) }
        PurchaseReceipt:
            type: object
            required: [date, quantities, files, receivedBy, recordedAt]
            properties:
                date: { type: string, format: date }
                quantities: { type: array, items: { type: number } }
                note: { type: string }
                files: { type: array, items: { $ref: '#/components/schemas/UploadedFile' } }
                receivedBy: { $ref: '#/components/schemas/UserRef' }
                recordedAt: { type: string, format: date-time }
        PurchaseRequest:
            allOf:
                - $ref: '#/components/schemas/PurchaseRequestInput'
                - type: object
                  required: [id, projectCode, status, amount, approvalId, requestedBy, requestedAt, received, receipts]
                  properties:
                      id: { type: string, examples: [PR-6910-0037], description: เลขใบขอซื้อ (เลขเดียวกับคำขอในศูนย์อนุมัติ) }
                      projectCode: { type: string }
                      status: { $ref: '#/components/schemas/PurchaseStatus' }
                      amount: { type: number, description: ยอดรวมโดยประมาณ }
                      approvalId: { type: string }
                      requestedBy: { $ref: '#/components/schemas/UserRef' }
                      requestedAt: { type: string, format: date-time }
                      decidedAt: { type: string, format: date-time }
                      decisionNote: { type: string }
                      order: { $ref: '#/components/schemas/PurchaseOrder' }
                      rejectedOrders: { type: array, items: { $ref: '#/components/schemas/PurchaseOrder' }, description: ใบสั่งซื้อที่ไม่ผ่านอนุมัติ (ประวัติ) }
                      received: { type: array, items: { type: number }, description: จำนวนที่รับแล้วสะสม เรียงตาม items }
                      receipts: { type: array, items: { $ref: '#/components/schemas/PurchaseReceipt' } }
                      cancelReason: { type: string }
        Material:
            type: object
            required: [code, name, unit, category, active]
            properties:
                code: { type: string, examples: [MAT-0001] }
                name: { type: string, minLength: 1, maxLength: 200 }
                unit: { type: string, minLength: 1, maxLength: 30 }
                category: { type: string, maxLength: 50, examples: [งานโครงสร้าง] }
                spec: { type: string, maxLength: 300, description: ขนาด/มาตรฐาน/ยี่ห้อที่กำหนด }
                lastPrice: { type: number, description: ราคาต่อหน่วยล่าสุดจากใบสั่งซื้อที่อนุมัติ (รวม VAT) }
                active: { type: boolean }
        MaterialInput:
            type: object
            required: [name, unit, category]
            properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                unit: { type: string, minLength: 1, maxLength: 30 }
                category: { type: string, minLength: 1, maxLength: 50 }
                spec: { type: string, maxLength: 300 }
                active: { type: boolean }
        BoqItem:
            type: object
            required: [name, unit, quantity]
            properties:
                materialCode: { type: string }
                name: { type: string, minLength: 1, maxLength: 200 }
                unit: { type: string, minLength: 1, maxLength: 30 }
                quantity: { type: number, minimum: 0, description: ปริมาณตาม BOQ (รวมเผื่อเสียแล้ว) }
                phaseCode: { type: string }
                note: { type: string, maxLength: 300 }
        ProjectBoq:
            type: object
            required: [items]
            properties:
                items: { type: array, items: { $ref: '#/components/schemas/BoqItem' } }
                updatedBy: { $ref: '#/components/schemas/UserRef' }
                updatedAt: { type: string, format: date-time }
        ProjectBoqInput:
            type: object
            required: [items]
            properties:
                items: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/BoqItem' } }
        StockMovementType:
            type: string
            description: return = ส่งของเหลือจากหน้างานเข้าคลังหลัก, issue = เบิกจากคลังหลักไปใช้ที่หน้างาน
            enum: [return, issue]
        StockMovementInput:
            type: object
            required: [type, name, unit, quantity, date]
            properties:
                type: { $ref: '#/components/schemas/StockMovementType' }
                materialCode: { type: string }
                name: { type: string, minLength: 1, maxLength: 200 }
                unit: { type: string, minLength: 1, maxLength: 30 }
                quantity: { type: number, exclusiveMinimum: 0 }
                date: { type: string, format: date, description: ไม่เกินวันนี้ }
                note: { type: string, maxLength: 500 }
        StockMovement:
            allOf:
                - $ref: '#/components/schemas/StockMovementInput'
                - type: object
                  required: [id, projectCode, recordedBy, recordedAt]
                  properties:
                      id: { type: string, examples: [SM-6910-0001] }
                      projectCode: { type: string }
                      recordedBy: { $ref: '#/components/schemas/UserRef' }
                      recordedAt: { type: string, format: date-time }
        StockBalance:
            type: object
            required: [key, name, unit, quantity, lastMovementAt]
            properties:
                key: { type: string, description: materialCode หรือ ชื่อ|หน่วย }
                materialCode: { type: string }
                name: { type: string }
                unit: { type: string }
                category: { type: string }
                quantity: { type: number, description: คงเหลือในคลังหลัก }
                lastMovementAt: { type: string, format: date-time }
        MaterialUsageStatus:
            type: string
            description: over = ใช้เกิน BOQ เกินเกณฑ์, under = ใช้น้อยกว่า BOQ เกินเกณฑ์ (ประเมินเมื่อโครงการเสร็จ), ok = อยู่ในเกณฑ์, in-progress = ยังใช้ไม่ครบ (โครงการยังไม่เสร็จ), not-in-boq = ไม่มีใน BOQ
            enum: [over, under, ok, in-progress, not-in-boq]
        MaterialUsageRow:
            type: object
            required: [key, name, unit, boqQuantity, requestedQuantity, orderedQuantity, receivedQuantity, issuedQuantity, returnedQuantity, usedQuantity, variance, spent, status]
            properties:
                key: { type: string }
                materialCode: { type: string }
                name: { type: string }
                unit: { type: string }
                category: { type: string }
                boqQuantity: { type: number }
                requestedQuantity: { type: number, description: ขอซื้อ (ไม่นับที่ไม่อนุมัติ/ยกเลิก) }
                orderedQuantity: { type: number, description: อยู่ในใบสั่งซื้อที่อนุมัติแล้ว }
                receivedQuantity: { type: number, description: รับเข้าหน้างานจากการสั่งซื้อ }
                issuedQuantity: { type: number, description: เบิกจากคลังหลัก }
                returnedQuantity: { type: number, description: ส่งของเหลือเข้าคลังหลัก }
                usedQuantity: { type: number, description: ใช้จริง = รับ + เบิก − ส่งคืน }
                variance: { type: number, description: ใช้จริง − BOQ (บวก = เกิน) }
                variancePercent: { type: [number, 'null'], description: เทียบกับ BOQ (null เมื่อไม่มีใน BOQ) }
                spent: { type: number, description: มูลค่าที่รับเข้าตามราคาใบสั่งซื้อ (รวม VAT) }
                status: { $ref: '#/components/schemas/MaterialUsageStatus' }
        MaterialUsage:
            type: object
            required: [tolerancePercent, projectCompleted, rows]
            properties:
                tolerancePercent: { type: number, description: เกณฑ์ยอมรับส่วนต่าง (%) }
                projectCompleted: { type: boolean }
                rows: { type: array, items: { $ref: '#/components/schemas/MaterialUsageRow' } }
        CompanyProfile:
            type: object
            required: [name, address, taxId, phone]
            properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                branch: { type: string, maxLength: 100, examples: [สำนักงานใหญ่] }
                address: { type: string, maxLength: 500 }
                taxId: { type: string, maxLength: 20 }
                phone: { type: string, maxLength: 50 }
                email: { type: string, maxLength: 100 }
        TakeoffMethod:
            type: string
            description: |
                วิธีถอดปริมาณ
                - volume: กว้าง × ยาว × สูง/ลึก × จำนวน (ลบ.ม.)
                - area: กว้าง × ยาว × จำนวน (ตร.ม.)
                - length: ยาว × จำนวน (เมตร)
                - count: จำนวน
                - rebar: น้ำหนักเหล็กเส้น = ยาวต่อเส้น × จำนวนเส้น × น้ำหนักต่อเมตรตามขนาด (กก.)
                - steel: เหล็กรูปพรรณ = ยาว × จำนวน × กก./ม. (กก.)
                - model: ปริมาณจากโมเดล IFC (ค่าใน count) — label บอกชิ้นงานที่นับ
            enum: [volume, area, length, count, rebar, steel, model]
        TakeoffLine:
            type: object
            required: [id, method, count]
            properties:
                id: { type: string }
                label: { type: string, maxLength: 200, examples: [F1 ฐานราก 1.20x1.20 ม.] }
                method: { $ref: '#/components/schemas/TakeoffMethod' }
                width: { type: number, minimum: 0, description: กว้าง (ม.) }
                length: { type: number, minimum: 0, description: ยาว (ม.) }
                height: { type: number, minimum: 0, description: สูง/ลึก/หนา (ม.) }
                count: { type: number, minimum: 0, description: จำนวน (ชิ้น/ต้น/เส้น) }
                diameter: { type: number, minimum: 0, description: ขนาดเหล็กเส้น (มม.) สำหรับ rebar }
                kgPerMeter: { type: number, minimum: 0, description: น้ำหนักต่อเมตร สำหรับ steel }
                deduct: { type: boolean, description: บรรทัดหัก (เช่น หักช่องเปิด) }
                result: { type: number, description: ผลของบรรทัด (หลังบ้านคำนวณ) }
        EstimateItem:
            type: object
            required: [id, kind, description, quantity, materialPrice, laborPrice]
            properties:
                id: { type: string }
                kind: { type: string, enum: [item, heading], description: heading = หัวข้อย่อยในหมวด (เช่น งานเหล็กเสริมคอนกรีต) ไม่มีปริมาณ }
                description: { type: string, maxLength: 300 }
                unit: { type: string, maxLength: 30 }
                quantity: { type: number, minimum: 0, description: ปริมาณ (มีบรรทัดถอดปริมาณ = หลังบ้านคำนวณจาก takeoff × (1 + waste%)) }
                materialPrice: { type: number, minimum: 0, description: ราคาวัสดุต่อหน่วย }
                laborPrice: { type: number, minimum: 0, description: ราคาค่าแรงต่อหน่วย }
                waste: { type: number, minimum: 0, maximum: 100, description: เผื่อเสีย (%) ใช้กับปริมาณจากการถอด }
                indent: { type: boolean, description: รายการย่อยใต้หัวข้อ (แสดงเยื้อง) }
                takeoff: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/TakeoffLine' } }
                note: { type: string, maxLength: 300 }
        EstimateGroup:
            type: object
            required: [id, title, items]
            properties:
                id: { type: string }
                title: { type: string, maxLength: 200, examples: [ฐานราก-ต่อม่อ] }
                items: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/EstimateItem' } }
        EstimateCategory:
            type: object
            required: [id, name, groups]
            properties:
                id: { type: string }
                name: { type: string, maxLength: 200, examples: [งานโครงสร้างคอนกรีตเสริมเหล็ก] }
                excluded: { type: boolean, description: ไม่รวมในสรุปราคา (เช่น งานเสนอเพิ่ม) }
                groups: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/EstimateGroup' } }
        EstimateInput:
            type: object
            required: [title, categories]
            properties:
                title: { type: string, minLength: 1, maxLength: 200, examples: [บ้านพักอาศัย ค.ส.ล. 1 ชั้น] }
                projectCode: { type: string, description: โครงการที่เกี่ยวข้อง (ไม่บังคับ) }
                location: { type: string, maxLength: 300 }
                ownerName: { type: string, maxLength: 200, description: เจ้าของโครงการ }
                estimator: { type: string, maxLength: 200, description: ผู้เสนอราคา }
                estimateDate: { type: string, format: date }
                area: { type: number, minimum: 0, description: พื้นที่ทั้งหมด (ตร.ม.) ใช้คำนวณราคาเฉลี่ยต่อ ตร.ม. }
                overheadPercent: { type: number, minimum: 0, maximum: 100, description: ค่าดำเนินการ (%) คิดจากค่าวัสดุ + ค่าแรง }
                profitPercent: { type: number, minimum: 0, maximum: 100, description: กำไรของบริษัท (%) คิดจากค่าวัสดุ + ค่าแรง }
                vatPercent: { type: number, minimum: 0, maximum: 100, description: ภาษีมูลค่าเพิ่ม (%) คิดจากราคารวมก่อนภาษี — BOQ ใหม่ตั้งต้น 7 }
                status: { type: string, enum: [draft, final], description: draft = ร่าง, final = ส่งลูกค้าแล้ว }
                notes: { type: array, maxItems: 20, items: { type: string, maxLength: 300 }, description: หมายเหตุท้ายสรุป เช่น ไม่รวมปั๊มน้ำ ถังเก็บน้ำ }
                categories: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/EstimateCategory' } }
                statement: { $ref: '#/components/schemas/OverheadStatement' }
        ResponsibilityRow:
            type: object
            required: [id, item, contractor, owner]
            properties:
                id: { type: string }
                item: { type: string, maxLength: 300, examples: [ค่าไฟฟ้าระหว่างก่อสร้าง] }
                contractor: { type: boolean, description: ผู้รับเหมารับผิดชอบ }
                owner: { type: boolean, description: เจ้าของโครงการรับผิดชอบ }
                note: { type: string, maxLength: 300 }
        StatementBlock:
            type: object
            description: |
                เนื้อหาในหัวข้อ
                - paragraph: ย่อหน้า (text)
                - list: รายการ (items) — style number = 1. 2. 3., bullet = จุด, clause = เลขตามหัวข้อ (3.1 3.2 …) มีหัวรายการ (title) ได้
                - responsibility: ตารางแบ่งความรับผิดชอบค่าใช้จ่าย (rows)
            required: [id, kind]
            properties:
                id: { type: string }
                kind: { type: string, enum: [paragraph, list, responsibility] }
                text: { type: string, maxLength: 3000 }
                style: { type: string, enum: [number, bullet, clause] }
                title: { type: string, maxLength: 300 }
                items: { type: array, maxItems: 60, items: { type: string, maxLength: 3000 } }
                rows: { type: array, maxItems: 60, items: { $ref: '#/components/schemas/ResponsibilityRow' } }
        StatementSubsection:
            type: object
            required: [id, title, blocks]
            properties:
                id: { type: string }
                title: { type: string, maxLength: 300 }
                blocks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/StatementBlock' } }
        StatementSection:
            type: object
            required: [id, title, blocks, subsections]
            properties:
                id: { type: string }
                title: { type: string, maxLength: 300 }
                blocks: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/StatementBlock' } }
                subsections: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/StatementSubsection' } }
        OverheadStatement:
            type: object
            description: เอกสารชี้แจงรายละเอียดค่าดำเนินการก่อสร้าง (แนบท้าย BOQ) — เลขหัวข้อระบบนับให้ตอนแสดงผล
            required: [title, sections]
            properties:
                title: { type: string, minLength: 1, maxLength: 300 }
                subtitle: { type: string, maxLength: 300 }
                sections: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/StatementSection' } }
        EstimateTotals:
            type: object
            required: [categories, material, labor, subtotal, overhead, profit, beforeVat, vat, grandTotal]
            properties:
                categories:
                    type: array
                    items:
                        type: object
                        required: [id, material, labor, total]
                        properties:
                            id: { type: string }
                            material: { type: number }
                            labor: { type: number }
                            total: { type: number }
                material: { type: number, description: รวมค่าวัสดุ (เฉพาะหมวดที่รวมในสรุป) }
                labor: { type: number }
                subtotal: { type: number, description: วัสดุ + ค่าแรง }
                overhead: { type: number, description: ค่าดำเนินการ }
                profit: { type: number, description: กำไร }
                beforeVat: { type: number, description: รวมก่อนภาษีมูลค่าเพิ่ม (วัสดุ + ค่าแรง + ค่าดำเนินการ + กำไร) }
                vat: { type: number, description: ภาษีมูลค่าเพิ่ม }
                grandTotal: { type: number, description: รวมเป็นเงินทั้งสิ้น (รวมภาษีมูลค่าเพิ่ม) }
                pricePerSqm: { type: [number, 'null'], description: ราคาเฉลี่ยต่อ ตร.ม. (null เมื่อไม่ระบุพื้นที่) }
        Estimate:
            allOf:
                - $ref: '#/components/schemas/EstimateInput'
                - type: object
                  required: [id, status, overheadPercent, profitPercent, vatPercent, notes, statement, totals, createdBy, createdAt, updatedAt]
                  properties:
                      id: { type: string, examples: [EST-6910-0001] }
                      totals: { $ref: '#/components/schemas/EstimateTotals' }
                      source: { $ref: '#/components/schemas/EstimateSource' }
                      createdBy: { $ref: '#/components/schemas/UserRef' }
                      createdAt: { type: string, format: date-time }
                      updatedBy: { $ref: '#/components/schemas/UserRef' }
                      updatedAt: { type: string, format: date-time }
        EstimateMaterial:
            type: object
            description: รายการวัสดุที่คำนวณจากปริมาณงาน (เผื่อเสียแล้ว) ใช้ส่งเข้า BOQ วัสดุของโครงการ
            required: [name, unit, quantity, basis]
            properties:
                materialCode: { type: string, description: รหัสในรายการวัสดุ (ถ้าจับคู่ได้) }
                name: { type: string }
                unit: { type: string }
                quantity: { type: number }
                basis: { type: string, description: ที่มาของจำนวน เช่น 34.2 ลบ.ม. + เผื่อ 5% }
        EstimateSource:
            type: object
            description: BOQ ที่ระบบถอดจากโมเดล IFC
            required: [kind, projectCode, modelId, fileName, analyzedAt, elements, seconds, warnings, materials, components]
            properties:
                kind: { type: string, enum: [ifc] }
                projectCode: { type: string }
                modelId: { type: string }
                modelTitle: { type: string }
                fileName: { type: string }
                application: { type: string, description: โปรแกรมที่ส่งออก เช่น Autodesk Revit 2027 }
                schema: { type: string, examples: [IFC2X3] }
                analyzedAt: { type: string, format: date-time }
                elements: { type: integer, description: จำนวนชิ้นงานที่ถอด }
                seconds: { type: number }
                warnings: { type: array, items: { type: string } }
                materials: { type: array, items: { $ref: '#/components/schemas/EstimateMaterial' } }
                components:
                    type: array
                    description: สรุปชิ้นงานในโมเดลตามชนิด (ตรวจสอบที่มาของตัวเลข)
                    items:
                        type: object
                        required: [storey, kind, label, count, volume, area, length, weight]
                        properties:
                            storey: { type: string }
                            kind: { type: string }
                            label: { type: string, examples: [คาน 0.20x0.40 m] }
                            material: { type: string }
                            count: { type: integer }
                            volume: { type: number }
                            area: { type: number }
                            length: { type: number }
                            weight: { type: number }
                appliedAt: { type: string, format: date-time, description: ส่งรายการวัสดุเข้า BOQ วัสดุของโครงการล่าสุด }
        EstimateFromModelInput:
            type: object
            required: [projectCode, modelId]
            properties:
                projectCode: { type: string }
                modelId: { type: string, description: เวอร์ชันแบบ 3 มิติของโครงการที่มีไฟล์ต้นฉบับ .ifc }
                title: { type: string, maxLength: 200 }
                concreteGrade: { type: number, description: กำลังอัดคอนกรีต (ksc) เมื่อวัสดุในโมเดลไม่ระบุ — ค่าตั้งต้น 210 }
        EstimateSummary:
            type: object
            required: [id, title, status, grandTotal, itemCount, updatedAt]
            properties:
                id: { type: string }
                title: { type: string }
                projectCode: { type: string }
                location: { type: string }
                ownerName: { type: string }
                status: { type: string, enum: [draft, final] }
                area: { type: number }
                grandTotal: { type: number }
                pricePerSqm: { type: [number, 'null'] }
                itemCount: { type: integer }
                fromModel: { type: boolean, description: ถอดจากโมเดล IFC }
                updatedAt: { type: string, format: date-time }
        EstimateCreateInput:
            type: object
            required: [title]
            properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                projectCode: { type: string }
                template: { type: string, enum: [standard, blank], description: standard = หมวดงานมาตรฐาน 6 หมวด, blank = ว่าง }
                copyFrom: { type: string, description: คัดลอกจาก BOQ เดิม (id) — มีค่านี้ไม่ใช้ template }
        EstimateRate:
            type: object
            required: [category, description, unit, materialPrice, laborPrice]
            properties:
                category: { type: string }
                group: { type: string }
                description: { type: string }
                unit: { type: string }
                materialPrice: { type: number }
                laborPrice: { type: number }
        RentalSource:
            type: string
            description: rent = เช่าจากภายนอก (ต้องอนุมัติ), borrow = ยืมจากคลังบริษัท (ไม่ต้องอนุมัติ)
            enum: [rent, borrow]
        RentalStatus:
            type: string
            description: pending = รออนุมัติ, approved = พร้อมรับเข้าหน้างาน, rejected = ไม่อนุมัติ, in-use = ใช้งานอยู่ที่หน้างาน, returned = คืนแล้ว, cancelled = ยกเลิก
            enum: [pending, approved, rejected, in-use, returned, cancelled]
        RentalInput:
            type: object
            required: [source, equipment, quantity, unit, startDate, endDate]
            properties:
                source: { $ref: '#/components/schemas/RentalSource' }
                equipment: { type: string, minLength: 1, maxLength: 200, examples: [นั่งร้านเหล็ก] }
                quantity: { type: number, exclusiveMinimum: 0 }
                unit: { type: string, minLength: 1, maxLength: 30, examples: [ชุด] }
                startDate: { type: string, format: date, description: วันเริ่มใช้งาน (ตามแผน) }
                endDate: { type: string, format: date, description: กำหนดคืน }
                vendor: { type: string, maxLength: 200, description: ร้านให้เช่า (จำเป็นเมื่อเช่า) / คลังหรือรหัสครุภัณฑ์ (ยืม) }
                rate: { type: number, minimum: 0, description: ค่าเช่าต่อหน่วยต่อ rateUnit (จำเป็นและต้องมากกว่า 0 เมื่อเช่า ยืมไม่ใช้) }
                rateUnit: { type: string, enum: [day, month], description: จำเป็นเมื่อเช่า }
                phaseCode: { type: string }
                note: { type: string, maxLength: 1000 }
        Rental:
            allOf:
                - $ref: '#/components/schemas/RentalInput'
                - type: object
                  required: [id, projectCode, status, estimatedCost, cost, overdue, requestedBy, requestedAt]
                  properties:
                      id: { type: string, examples: [RT-6910-0003, BR-6910-0001] }
                      projectCode: { type: string }
                      status: { $ref: '#/components/schemas/RentalStatus' }
                      estimatedCost: { type: number, description: ค่าเช่าตามแผน (เริ่ม → กำหนดคืน) ยืม = 0 }
                      cost: { type: number, description: ค่าเช่าจริงถึงวันนี้/วันคืน (คิดตามวันที่รับเข้าหน้างานจริง) }
                      overdue: { type: boolean, description: ใช้งานอยู่และเลยกำหนดคืนแล้ว }
                      approvalId: { type: string, description: เฉพาะการเช่า }
                      requestedBy: { $ref: '#/components/schemas/UserRef' }
                      requestedAt: { type: string, format: date-time }
                      decidedAt: { type: string, format: date-time }
                      decisionNote: { type: string }
                      deliveredAt: { type: string, format: date, description: วันที่รับเข้าหน้างานจริง }
                      deliveredBy: { $ref: '#/components/schemas/UserRef' }
                      deliveryNote: { type: string }
                      returnedAt: { type: string, format: date }
                      returnedBy: { $ref: '#/components/schemas/UserRef' }
                      returnCondition: { type: string, enum: [good, damaged, lost] }
                      returnNote: { type: string }
                      extensions: { type: array, items: { type: object, required: [from, to, at], properties: { from: { type: string, format: date }, to: { type: string, format: date }, note: { type: string }, by: { $ref: '#/components/schemas/UserRef' }, at: { type: string, format: date-time } } } }
                      cancelReason: { type: string }
        RentalStartInput:
            type: object
            required: [date]
            properties:
                date: { type: string, format: date, description: วันที่รับเข้าหน้างาน (ไม่ก่อนวันที่ขอ และไม่เกินวันนี้) }
                note: { type: string, maxLength: 500 }
        RentalReturnInput:
            type: object
            required: [date, condition]
            properties:
                date: { type: string, format: date, description: วันที่คืน (ไม่ก่อนวันที่รับเข้าหน้างาน และไม่เกินวันนี้) }
                condition: { type: string, enum: [good, damaged, lost] }
                note: { type: string, maxLength: 500, description: จำเป็นเมื่อชำรุดหรือสูญหาย }
        RentalExtendInput:
            type: object
            required: [endDate]
            properties:
                endDate: { type: string, format: date, description: กำหนดคืนใหม่ (หลังกำหนดเดิม) }
                note: { type: string, maxLength: 500 }
        CancelInput:
            type: object
            required: [reason]
            properties:
                reason: { type: string, minLength: 1, maxLength: 500 }

        ConstructionOptionValue:
            description: single = รหัสตัวเลือก, multiple = รายการรหัส, boolean = true/false
            anyOf:
                - { type: string }
                - { type: boolean }
                - { type: array, items: { type: string } }
        ConstructionOptionChoice:
            type: object
            required: [value, label]
            properties:
                value: { type: string }
                label: { type: string }
                description: { type: string }
                visibleWhen:
                    type: object
                    description: เลือกได้เฉพาะเมื่อตัวเลือก key มีค่าอยู่ใน values (เช่น 4-8 ชั้นเฉพาะอาคารพาณิชย์)
                    required: [key, values]
                    properties:
                        key: { type: string }
                        values: { type: array, items: { type: string } }
        ConstructionOptionGroup:
            type: object
            required: [key, section, label, type, choices, default, affectsPhases]
            properties:
                key: { type: string, examples: [foundation] }
                section: { type: string, description: หัวข้อที่ใช้จัดกลุ่มในฟอร์ม เช่น งานฐานราก }
                label: { type: string }
                description: { type: string }
                type: { type: string, enum: [single, multiple, boolean] }
                choices:
                    type: array
                    description: ว่างเมื่อ type = boolean
                    items: { $ref: '#/components/schemas/ConstructionOptionChoice' }
                default: { $ref: '#/components/schemas/ConstructionOptionValue' }
                affectsPhases:
                    type: array
                    description: ขั้นตอนในแผนงานที่ตัวเลือกนี้เพิ่ม/เปลี่ยนงาน (หลังบ้านคำนวณจากแม่แบบ)
                    items:
                        type: object
                        required: [code, shortName]
                        properties:
                            code: { type: string }
                            shortName: { type: string }
                visibleWhen:
                    type: object
                    description: แสดงเฉพาะเมื่อตัวเลือก key มีค่าอยู่ใน values
                    required: [key, values]
                    properties:
                        key: { type: string }
                        values: { type: array, items: { type: string } }
        ConstructionSetupOptions:
            type: object
            description: ค่าของแต่ละตัวเลือก (key → ค่า) ตาม GET /settings/construction-options
            additionalProperties: { $ref: '#/components/schemas/ConstructionOptionValue' }
        CustomTaskInput:
            type: object
            description: งานย่อยที่เพิ่มเองในโครงการนี้ (นอกแม่แบบ)
            required: [id, phaseCode, name, durationDays]
            properties:
                id: { type: string, description: รหัสที่หน้าบ้านสร้าง ใช้อ้างอิงตอนแก้ไข/ลบ }
                phaseCode: { type: string, examples: ['05'] }
                name: { type: string, minLength: 1, maxLength: 200 }
                team: { type: string, description: ไม่ระบุ = ผู้รับเหมา }
                afterCode: { type: string, description: ทำต่อจากงานรหัสนี้ในขั้นตอนเดียวกัน (ไม่ระบุ = ต่อท้ายงานสุดท้ายของขั้นตอน) }
                durationDays: { type: integer, minimum: 1, maximum: 120 }
                isHoldPoint: { type: boolean, default: false, description: เป็นจุดตรวจที่ต้องผ่านก่อนทำงานถัดไป }
        ProjectSetupInput:
            type: object
            required: [options]
            properties:
                options: { $ref: '#/components/schemas/ConstructionSetupOptions' }
                excludedTasks:
                    type: array
                    description: รหัสงานย่อยที่ไม่ต้องทำในโครงการนี้ — ตัดจุดตรวจ (Hold Point) และหมุดหมาย (Milestone) ไม่ได้ (422); รหัสที่ไม่อยู่ในแผนตามตัวเลือก หลังบ้านตัดทิ้ง
                    items: { type: string }
                customTasks:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/CustomTaskInput' }
                paymentPercents:
                    type: array
                    description: |
                        สัดส่วนเบิกจ่าย (% ของมูลค่าสัญญา) ของแต่ละงวด เรียงตาม ProjectSetup.paymentSchedule
                        ต้องมีครบทุกงวด แต่ละงวดมากกว่า 0 (ทศนิยมไม่เกิน 2 ตำแหน่ง) และรวมกันได้ 100 (422)
                        ไม่ส่ง = คงสัดส่วนที่บันทึกไว้ (ยังไม่เคยบันทึก = ค่าเริ่มต้น) — หน้าตัวอย่าง (preview) ไม่ตรวจและไม่ใช้ค่านี้
                    items: { type: number, exclusiveMinimum: 0, maximum: 100 }
        PaymentScheduleItem:
            type: object
            description: งวดเงินตามสัญญา เบิกได้เมื่อขั้นตอนที่ผูกไว้เสร็จทั้งหมด
            required: [no, title, phaseCodes, percent, defaultPercent]
            properties:
                no: { type: integer }
                title: { type: string }
                phaseCodes: { type: array, items: { type: string } }
                percent: { type: number, description: สัดส่วนที่ใช้ (% ของมูลค่าสัญญา) }
                defaultPercent: { type: number, description: สัดส่วนตั้งต้นของแม่แบบ }
        ProjectSetup:
            type: object
            required: [configured, locked, configuredAt, configuredBy, options, excludedTasks, customTasks, paymentSchedule]
            properties:
                configured: { type: boolean }
                locked: { type: boolean, description: true เมื่อเริ่มรายงานความคืบหน้าแล้ว แก้การตั้งค่าไม่ได้ }
                lockedReason: { type: string }
                configuredAt: { type: [string, 'null'], format: date-time }
                configuredBy: { type: [string, 'null'] }
                options: { $ref: '#/components/schemas/ConstructionSetupOptions' }
                excludedTasks: { type: array, items: { type: string } }
                customTasks: { type: array, items: { $ref: '#/components/schemas/CustomTaskInput' } }
                paymentSchedule: { type: array, items: { $ref: '#/components/schemas/PaymentScheduleItem' } }
        SetupPreviewTask:
            type: object
            description: งานย่อยในแผน รวมงานที่ถูกตัดออก (included = false) เพื่อให้เลือกกลับได้
            required: [code, name, team, start, end, isHoldPoint, isMilestone, optional, included, required, custom]
            properties:
                code: { type: string }
                name: { type: string }
                team: { type: string }
                start: { type: string, format: date }
                end: { type: string, format: date }
                isHoldPoint: { type: boolean }
                isMilestone: { type: boolean }
                optional: { type: boolean, description: งานที่มีเพราะตัวเลือกที่เลือก (ไม่ใช่งานพื้นฐาน) }
                included: { type: boolean, description: false = ตัดออกจากโครงการนี้ (ไม่อยู่ในไทม์ไลน์) }
                required: { type: boolean, description: จุดตรวจ/หมุดหมาย ตัดออกไม่ได้ }
                custom: { type: boolean, description: งานที่เพิ่มเอง }
                customId: { type: string, description: id ของ CustomTaskInput (เฉพาะงานที่เพิ่มเอง) }
        SetupPreview:
            type: object
            required: [taskCount, holdPointCount, milestoneCount, optionalTaskCount, excludedCount, customCount, phases]
            properties:
                taskCount: { type: integer, description: งานที่ทำจริง (ไม่รวมหมุดหมายและงานที่ตัดออก) }
                excludedCount: { type: integer }
                customCount: { type: integer }
                holdPointCount: { type: integer }
                milestoneCount: { type: integer }
                optionalTaskCount: { type: integer }
                phases:
                    type: array
                    items:
                        type: object
                        required: [step, code, name, shortName, start, end, tasks]
                        properties:
                            step: { type: integer }
                            code: { type: string }
                            name: { type: string }
                            shortName: { type: string }
                            start: { type: string, format: date }
                            end: { type: string, format: date }
                            tasks:
                                type: array
                                items: { $ref: '#/components/schemas/SetupPreviewTask' }

        TimelineStatus:
            type: string
            enum: [done, active, pending]
        TimelineTask:
            type: object
            required: [code, name, team, start, end, progress, status, isHoldPoint, isMilestone, isPaymentMilestone, involvesOwner]
            properties:
                code: { type: string }
                name: { type: string }
                team: { type: string }
                note: { type: string }
                start: { type: string, format: date }
                end: { type: string, format: date }
                progress: { type: integer, minimum: 0, maximum: 100 }
                status: { $ref: '#/components/schemas/TimelineStatus' }
                startedOn: { type: string, format: date, description: วันที่บันทึกหน้างานครั้งแรกของงานนี้ (ไม่มี = ยังไม่มีการอัปเดต) }
                lastUpdatedOn: { type: string, format: date, description: วันที่บันทึกหน้างาน/ผลตรวจล่าสุดของงานนี้ }
                isHoldPoint: { type: boolean }
                isMilestone: { type: boolean }
                isPaymentMilestone: { type: boolean }
                involvesOwner: { type: boolean }
        TimelinePhase:
            type: object
            required: [step, code, name, shortName, summary, start, end, progress, status, tasks, holdPoints]
            properties:
                step: { type: integer }
                code: { type: string }
                name: { type: string }
                shortName: { type: string }
                summary: { type: string }
                start: { type: string, format: date }
                end: { type: string, format: date }
                progress: { type: integer, minimum: 0, maximum: 100 }
                status: { $ref: '#/components/schemas/TimelineStatus' }
                tasks:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineTask' }
                holdPoints:
                    type: object
                    required: [passed, total]
                    properties:
                        passed: { type: integer }
                        total: { type: integer }
        ProjectTimeline:
            type: object
            required: [progress, phases]
            properties:
                progress: { type: integer, minimum: 0, maximum: 100 }
                phases:
                    type: array
                    items: { $ref: '#/components/schemas/TimelinePhase' }

        UploadedFile:
            type: object
            required: [id, url, name, sizeKb, contentType]
            properties:
                id: { type: string }
                url: { type: string, format: uri }
                name: { type: string }
                sizeKb: { type: integer }
                contentType: { type: string }
        Weather:
            type: string
            enum: [sunny, cloudy, light-rain, heavy-rain]
        IssueSeverity:
            type: string
            enum: [low, medium, high]
        SiteIssue:
            type: object
            required: [title, severity]
            properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                severity: { $ref: '#/components/schemas/IssueSeverity' }
        TaskProgressInput:
            type: object
            required: [taskCode, progress]
            properties:
                taskCode: { type: string }
                progress: { type: integer, minimum: 0, maximum: 100 }
        ProgressUpdateInput:
            type: object
            description: ต้องมีอย่างน้อย 1 อย่าง ได้แก่ taskChanges, note หรือ documents
            required: [reportDate, weather, workers]
            properties:
                reportDate: { type: string, format: date, description: วันที่ทำงาน (ไม่เกินวันนี้) }
                weather: { $ref: '#/components/schemas/Weather' }
                workers: { type: integer, minimum: 0, description: จำนวนแรงงานในวันนั้น }
                note: { type: string, maxLength: 2000 }
                taskChanges:
                    type: array
                    items: { $ref: '#/components/schemas/TaskProgressInput' }
                issues:
                    type: array
                    items: { $ref: '#/components/schemas/SiteIssue' }
                photoIds:
                    type: array
                    description: id จาก POST /uploads (ต้องเป็นไฟล์รูป)
                    items: { type: string }
                documents:
                    type: array
                    description: เอกสารแนบ จะถูกเพิ่มในเอกสารของโครงการ (GET /projects/{code}/documents)
                    items: { $ref: '#/components/schemas/DocumentAttachmentInput' }
        DocumentAttachmentInput:
            type: object
            required: [fileId, category]
            properties:
                fileId: { type: string, description: id จาก POST /uploads }
                category: { $ref: '#/components/schemas/DocumentCategory' }
                name: { type: string, maxLength: 200, description: ชื่อเอกสาร (ไม่ระบุ = ใช้ชื่อไฟล์) }
        InspectionInput:
            type: object
            required: [result]
            properties:
                result: { type: string, enum: [passed, failed] }
                note: { type: string, maxLength: 2000, description: จำเป็นเมื่อไม่ผ่าน }
                photoIds:
                    type: array
                    items: { type: string }
                documents:
                    type: array
                    description: เช่น รายงานผลตรวจ ผลทดสอบ
                    items: { $ref: '#/components/schemas/DocumentAttachmentInput' }
        ProgressUpdate:
            type: object
            required: [id, projectCode, reportDate, createdAt, author, weather, workers, taskChanges, issues, photos, documents, overallProgress]
            properties:
                id: { type: string }
                projectCode: { type: string }
                reportDate: { type: string, format: date }
                createdAt: { type: string, format: date-time }
                author: { $ref: '#/components/schemas/UserRef' }
                weather: { $ref: '#/components/schemas/Weather' }
                workers: { type: integer }
                note: { type: string }
                taskChanges:
                    type: array
                    items:
                        type: object
                        required: [taskCode, taskName, phaseStep, from, to]
                        properties:
                            taskCode: { type: string }
                            taskName: { type: string }
                            phaseStep: { type: integer }
                            from: { type: integer }
                            to: { type: integer }
                inspection:
                    type: object
                    required: [taskCode, taskName, result]
                    properties:
                        taskCode: { type: string }
                        taskName: { type: string }
                        result: { type: string, enum: [passed, failed] }
                issues:
                    type: array
                    items: { $ref: '#/components/schemas/SiteIssue' }
                photos:
                    type: array
                    items: { $ref: '#/components/schemas/UploadedFile' }
                documents:
                    type: array
                    description: เอกสารที่แนบกับบันทึกนี้
                    items: { $ref: '#/components/schemas/ProjectDocument' }
                overallProgress: { type: integer, description: '% ภาพรวมโครงการหลังบันทึกนี้' }
        ProgressUpdatePage:
            allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required: [items]
                  properties:
                      items:
                          type: array
                          items: { $ref: '#/components/schemas/ProgressUpdate' }

        InstallmentStatus:
            type: string
            enum: [paid, due, working, upcoming]
        Installment:
            type: object
            required: [no, title, phaseSteps, percent, amount, status, dueDate]
            properties:
                no: { type: integer }
                title: { type: string }
                phaseSteps:
                    type: array
                    items: { type: integer }
                percent: { type: number }
                amount: { type: number }
                status: { $ref: '#/components/schemas/InstallmentStatus' }
                dueDate: { type: string, format: date }
                paidDate: { type: [string, 'null'], format: date }
                changeOrderId: { type: string, description: งวดของงานเพิ่ม-ลด (ไม่อยู่ในงวดตามสัญญาเดิม) }
                payment: { $ref: '#/components/schemas/InstallmentPayment' }
        PaymentMethod:
            type: string
            enum: [transfer, cheque, cash]
        InstallmentPaymentInput:
            type: object
            required: [paidDate, amount, method, evidenceIds]
            properties:
                paidDate: { type: string, format: date, description: วันที่ได้รับเงิน (ไม่เกินวันนี้ ไม่ก่อนวันเซ็นสัญญา) }
                amount: { type: number, exclusiveMinimum: 0, description: ยอดที่ได้รับจริง (บาท) }
                withholdingTax: { type: number, minimum: 0, default: 0, description: ภาษีหัก ณ ที่จ่ายที่ลูกค้าหักไว้ (บาท) }
                method: { $ref: '#/components/schemas/PaymentMethod' }
                reference: { type: string, maxLength: 100, description: เลขที่อ้างอิง เช่น เลขที่ใบเสร็จ เลขเช็ค เลขอ้างอิงการโอน }
                note: { type: string, maxLength: 500, description: จำเป็นเมื่อยอดรับ + ภาษีหัก ณ ที่จ่าย น้อยกว่ายอดงวด }
                evidenceIds:
                    type: array
                    minItems: 1
                    maxItems: 10
                    description: หลักฐานการชำระ เช่น สลิปโอนเงิน สำเนาเช็ค ใบเสร็จ (id จาก POST /uploads)
                    items: { type: string }
        InstallmentPayment:
            type: object
            required: [id, paidDate, amount, withholdingTax, method, evidence, recordedBy, recordedAt]
            properties:
                id: { type: string }
                paidDate: { type: string, format: date }
                amount: { type: number }
                withholdingTax: { type: number }
                method: { $ref: '#/components/schemas/PaymentMethod' }
                reference: { type: string }
                note: { type: string }
                evidence:
                    type: array
                    description: ว่างได้เฉพาะข้อมูลตัวอย่างที่ระบบสร้าง
                    items: { $ref: '#/components/schemas/UploadedFile' }
                recordedBy: { $ref: '#/components/schemas/UserRef' }
                recordedAt: { type: string, format: date-time }

        SitePhoto:
            type: object
            required: [id, url, thumbnailUrl, takenAt, caption, phaseCode, phaseStep, phaseShortName]
            properties:
                id: { type: string }
                url: { type: string, format: uri }
                thumbnailUrl: { type: string, format: uri }
                takenAt: { type: string, format: date-time }
                caption: { type: string }
                phaseCode: { type: string }
                phaseStep: { type: integer }
                phaseShortName: { type: string }
        SitePhotoPage:
            allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required: [items, phases]
                  properties:
                      items:
                          type: array
                          items: { $ref: '#/components/schemas/SitePhoto' }
                      phases:
                          type: array
                          description: จำนวนภาพแยกตามขั้นตอน (ไม่ขึ้นกับตัวกรอง phaseCode) ใช้ทำตัวกรอง
                          items:
                              type: object
                              required: [phaseCode, phaseStep, phaseShortName, count]
                              properties:
                                  phaseCode: { type: string }
                                  phaseStep: { type: integer }
                                  phaseShortName: { type: string }
                                  count: { type: integer }

        DocumentCategory:
            type: string
            enum: [contract, drawing, permit, inspection, billing, handover]
        ProjectDocument:
            type: object
            required: [id, category, name, date, fileType, sizeKb, downloadUrl]
            properties:
                id: { type: string }
                category: { $ref: '#/components/schemas/DocumentCategory' }
                name: { type: string }
                date: { type: string, format: date }
                fileType: { type: string, enum: [pdf, dwg, xlsx, docx, image] }
                sizeKb: { type: integer }
                downloadUrl: { type: string, format: uri, description: ลิงก์ชั่วคราว (signed URL) }
                uploadedBy: { type: string, description: ผู้แนบเอกสาร (เอกสารที่ระบบสร้างเองไม่มีฟิลด์นี้) }
                updateId: { type: string, description: บันทึกหน้างานที่แนบเอกสารนี้ (ถ้ามี) }

        SubcontractorTrade:
            type: string
            description: สาขางานของผู้รับเหมาช่วง (หน้าบ้านแปลเป็นข้อความไทย)
            enum: [piling, structure, masonry, roofing, waterproofing, electrical, plumbing, hvac, aluminium, tiling, ceiling, painting, carpentry, landscape, solar, pool, lift, fire, other]
        SubcontractorInput:
            type: object
            required: [name, trades, contactName, phone]
            properties:
                name: { type: string, minLength: 1, description: ชื่อบริษัท/ทีมช่าง }
                trades: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SubcontractorTrade' } }
                contactName: { type: string, minLength: 1 }
                phone: { type: string, description: ตัวเลข 9-10 หลัก ขึ้นต้นด้วย 0 }
                email: { type: string }
                lineId: { type: string }
                taxId: { type: string, description: เลขประจำตัวผู้เสียภาษี 13 หลัก (ซ้ำกับรายอื่นไม่ได้ 409) }
                address: { type: string }
                note: { type: string }
                status: { type: string, enum: [active, inactive], default: active, description: inactive = ไม่ใช้งานแล้ว มอบหมายงานใหม่ไม่ได้ }
        Subcontractor:
            allOf:
                - $ref: '#/components/schemas/SubcontractorInput'
                - type: object
                  required: [id, code, status, activeProjects]
                  properties:
                      id: { type: string }
                      code: { type: string, examples: [SUB-001] }
                      activeProjects: { type: integer, description: จำนวนโครงการที่ยังไม่ส่งมอบที่มอบหมายอยู่ }
        StaffRole:
            type: string
            enum: [project-manager, engineer, site-supervisor, architect, foreman, safety-officer, purchasing, accounting]
        StaffAssignmentInput:
            type: object
            required: [personnelId, role]
            properties:
                personnelId: { type: string }
                role: { $ref: '#/components/schemas/StaffRole' }
                note: { type: string, description: เช่น หน้าที่เฉพาะในโครงการนี้ }
        StaffAssignment:
            type: object
            required: [id, personnelId, name, role]
            properties:
                id: { type: string }
                personnelId: { type: string }
                name: { type: string }
                position: { type: string }
                phone: { type: string }
                role: { $ref: '#/components/schemas/StaffRole' }
                note: { type: string }
        SubcontractorAssignmentInput:
            type: object
            required: [subcontractorId, scope, phaseCodes]
            properties:
                subcontractorId: { type: string }
                scope: { type: string, minLength: 1, description: ขอบเขตงานที่จ้าง }
                phaseCodes: { type: array, minItems: 1, items: { type: string }, description: ขั้นตอนในไทม์ไลน์ที่รับผิดชอบ }
                contractValue: { type: number, minimum: 0, description: มูลค่าจ้าง (บาท) }
                note: { type: string }
        SubcontractorAssignment:
            type: object
            required: [id, subcontractor, scope, phaseCodes, start, end, progress, status]
            properties:
                id: { type: string }
                subcontractor:
                    type: object
                    required: [id, code, name, contactName, phone, trades]
                    properties:
                        id: { type: string }
                        code: { type: string }
                        name: { type: string }
                        contactName: { type: string }
                        phone: { type: string }
                        trades: { type: array, items: { $ref: '#/components/schemas/SubcontractorTrade' } }
                scope: { type: string }
                phaseCodes: { type: array, items: { type: string } }
                contractValue: { type: number, description: ส่งเฉพาะผู้มีสิทธิ์ project.manage }
                note: { type: string }
                start: { type: string, format: date, description: วันเริ่มของขั้นตอนแรกที่รับผิดชอบ }
                end: { type: string, format: date }
                progress: { type: integer, minimum: 0, maximum: 100, description: ความคืบหน้าของขั้นตอนที่รับผิดชอบ (ถ่วงตามระยะเวลา) }
                status: { type: string, enum: [upcoming, working, done] }
        ProjectAssignments:
            type: object
            required: [staff, subcontractors]
            properties:
                staff: { type: array, items: { $ref: '#/components/schemas/StaffAssignment' } }
                subcontractors: { type: array, items: { $ref: '#/components/schemas/SubcontractorAssignment' } }
        TeamMember:
            type: object
            required: [name, role, phone]
            properties:
                name: { type: string }
                role: { type: string }
                phone: { type: string }

        RoomKind:
            type: string
            enum: [bedroom, bathroom, living, dining, kitchen, garage, stair, void, other]
        ModelSourceApp:
            type: string
            description: โปรแกรมที่ใช้ออกแบบ (ใช้แสดงวิธีส่งออกไฟล์และแยกประเภทไฟล์ต้นฉบับ)
            enum: [sketchup, revit, other]
        ModelFormat:
            type: string
            description: |
                รูปแบบไฟล์ที่เบราว์เซอร์แสดงผลได้ (ไฟล์ .skp / .rvt แสดงในเบราว์เซอร์ไม่ได้ ต้องส่งออกเป็นรูปแบบเหล่านี้)
                - glb / gltf: มาตรฐานเว็บ (SketchUp และ Revit ส่งออกได้ผ่านปลั๊กอิน) — gltf ต้องเป็นไฟล์เดียว (ฝังข้อมูลไว้ในไฟล์)
                - dae: COLLADA (SketchUp: File > Export > 3D Model)
                - fbx: (Revit: เปิดมุมมอง 3D แล้ว File > Export > FBX / SketchUp Pro)
                - obj: (SketchUp Pro และโปรแกรมอื่น) ไม่มีข้อมูลแกนตั้ง ให้ระบุ upAxis
            enum: [glb, gltf, dae, fbx, obj]
        ProjectModelInput:
            type: object
            description: ต้องมีอย่างน้อย 1 ไฟล์ — fileId (แสดงเป็น 3 มิติได้) หรือ sourceFileId (.skp / .rvt เก็บไว้ดาวน์โหลด ยังแสดงเป็น 3 มิติไม่ได้)
            required: [sourceApp]
            properties:
                fileId: { type: string, description: ไฟล์สำหรับแสดงผล (.glb .gltf .dae .fbx .obj) จาก POST /uploads }
                sourceFileId: { type: string, description: 'ไฟล์ต้นฉบับ (.skp .rvt หรือ .ifc) จาก POST /uploads — .skp และ .ifc หลังบ้านแปลงเป็น 3 มิติให้ (IFC แยกตามงาน หมวด ชั้น ระบบ รวมเหล็กเสริม)' }
                sourceApp: { $ref: '#/components/schemas/ModelSourceApp' }
                title: { type: string, maxLength: 120, description: ชื่อเวอร์ชัน เช่น แบบอนุมัติลูกค้า (ไม่ระบุ = แบบ 3D ฉบับที่ n) }
                note: { type: string, maxLength: 500 }
                upAxis: { type: string, enum: [y, z], default: y, description: แกนตั้งของไฟล์ (ใช้กับ obj เท่านั้น รูปแบบอื่นอ่านจากไฟล์) }
        RenderView:
            type: string
            description: มุมของภาพทัศนียภาพ
            enum: [front, back, left, right]
        ProjectHouseInput:
            type: object
            description: ข้อมูลแบบบ้านของโครงการที่ผู้ตั้งค่ากรอกเอง (ภาพเป็น id จาก POST /uploads ต้องเป็นไฟล์รูป)
            required: [name, floorPlans, renders]
            properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                usableArea: { type: number, minimum: 0, description: พื้นที่ใช้สอย (ตร.ม.) }
                width: { type: number, minimum: 0, description: ความกว้างตัวบ้าน (ม.) }
                depth: { type: number, minimum: 0, description: ความลึกตัวบ้าน (ม.) }
                floors: { type: integer, minimum: 1, maximum: 10 }
                bedrooms: { type: integer, minimum: 0, maximum: 50 }
                bathrooms: { type: integer, minimum: 0, maximum: 50 }
                kitchens: { type: integer, minimum: 0, maximum: 20 }
                parking: { type: integer, minimum: 0, maximum: 50 }
                floorPlans:
                    type: array
                    maxItems: 10
                    description: ภาพแปลนรายชั้น ตามลำดับที่แสดง
                    items:
                        type: object
                        required: [label, fileId]
                        properties:
                            label: { type: string, minLength: 1, maxLength: 60, examples: [ชั้น 1] }
                            fileId: { type: string }
                renders:
                    type: object
                    description: ภาพทัศนียภาพ 4 มุม (ไม่ส่งมุมใด = ไม่มีภาพมุมนั้น)
                    properties:
                        front: { type: string }
                        back: { type: string }
                        left: { type: string }
                        right: { type: string }
        ProjectHouse:
            type: object
            required: [configured, name, floorPlans, renders]
            properties:
                configured: { type: boolean, description: false = ยังไม่ได้ตั้งค่า (ค่าที่ส่งมาเติมจากแบบบ้านในคลังถ้าเลือกไว้) }
                name: { type: string }
                description: { type: string }
                usableArea: { type: number }
                width: { type: number }
                depth: { type: number }
                floors: { type: integer }
                bedrooms: { type: integer }
                bathrooms: { type: integer }
                kitchens: { type: integer }
                parking: { type: integer }
                floorPlans:
                    type: array
                    items:
                        type: object
                        required: [label, image]
                        properties:
                            label: { type: string }
                            image: { $ref: '#/components/schemas/UploadedFile' }
                renders:
                    type: object
                    properties:
                        front: { $ref: '#/components/schemas/UploadedFile' }
                        back: { $ref: '#/components/schemas/UploadedFile' }
                        left: { $ref: '#/components/schemas/UploadedFile' }
                        right: { $ref: '#/components/schemas/UploadedFile' }
                updatedBy: { $ref: '#/components/schemas/UserRef' }
                updatedAt: { type: string, format: date-time }
        ModelConversion:
            type: object
            description: |
                การแปลงไฟล์ต้นฉบับ (.skp หรือ .ifc) เป็น .glb ที่หลังบ้าน (มีเฉพาะเวอร์ชันที่แนบไฟล์ต้นฉบับโดยไม่มีไฟล์สำหรับแสดงผล)
                .skp ใช้ SketchUp C API บนเซิร์ฟเวอร์ (เปิดได้เฉพาะไฟล์จากรุ่นเดียวกันหรือเก่ากว่า) ส่วน .ifc ใช้ web-ifc
                - queued / converting: รอคิว / กำลังแปลง (หน้าบ้านโหลดรายการใหม่เป็นระยะ)
                - done: แปลงแล้ว ได้ไฟล์ .glb ใน file
                - failed: แปลงไม่สำเร็จ (ดู message) สั่งแปลงใหม่ได้
                - unavailable: เซิร์ฟเวอร์ไม่มี SketchUp สำหรับแปลงไฟล์ .skp
            required: [status]
            properties:
                status: { type: string, enum: [queued, converting, done, failed, unavailable] }
                message: { type: string }
                triangles: { type: integer, description: จำนวนสามเหลี่ยมของโมเดลที่แปลงได้ }
                finishedAt: { type: string, format: date-time }
        ProjectModel:
            type: object
            description: แบบบ้าน 3 มิติของโครงการ 1 เวอร์ชัน (ล่าสุด = แบบที่ใช้อยู่)
            required: [id, version, title, sourceApp, upAxis, uploadedBy, uploadedAt]
            properties:
                id: { type: string }
                version: { type: integer }
                title: { type: string }
                sourceApp: { $ref: '#/components/schemas/ModelSourceApp' }
                format: { $ref: '#/components/schemas/ModelFormat', description: ไม่มี = มีเฉพาะไฟล์ต้นฉบับ (ยังแสดงเป็น 3 มิติไม่ได้) }
                file: { $ref: '#/components/schemas/UploadedFile', description: ไฟล์สำหรับแสดงผล (ไม่มี = มีเฉพาะไฟล์ต้นฉบับ) }
                sourceFile: { $ref: '#/components/schemas/UploadedFile' }
                conversion: { $ref: '#/components/schemas/ModelConversion' }
                elements: { $ref: '#/components/schemas/UploadedFile', description: 'ข้อมูลชิ้นงาน (JSON) ของไฟล์ที่แปลงจาก IFC — ลำดับในอาร์เรย์ elements ตรงกับค่า attribute _ELEMENT ของจุดใน .glb ใช้แสดงคุณสมบัติเมื่อคลิกชิ้นงาน' }
                upAxis: { type: string, enum: [y, z] }
                note: { type: string }
                uploadedBy: { $ref: '#/components/schemas/UserRef' }
                uploadedAt: { type: string, format: date-time }
        HousePlan:
            type: object
            required: [code, name, description, width, depth, floorHeight, parking, floors]
            properties:
                code: { type: string }
                name: { type: string }
                description: { type: string }
                width: { type: number, description: เมตร }
                depth: { type: number, description: เมตร }
                floorHeight: { type: number }
                parking: { type: integer }
                renderUrl: { type: string, format: uri, description: ภาพทัศนียภาพ }
                modelUrl: { type: string, format: uri, description: ไฟล์โมเดล .glb }
                floors:
                    type: array
                    items:
                        type: object
                        required: [label, rooms]
                        properties:
                            label: { type: string }
                            rooms:
                                type: array
                                items:
                                    type: object
                                    required: [name, kind, x, y, w, h]
                                    properties:
                                        name: { type: string }
                                        kind: { $ref: '#/components/schemas/RoomKind' }
                                        x: { type: number }
                                        y: { type: number }
                                        w: { type: number }
                                        h: { type: number }

        # ---------- บุคลากร ----------
        PersonnelDocument:
            type: object
            required: [type, fileName, url]
            properties:
                type: { type: string, description: ประเภทเอกสาร เช่น สำเนาบัตรประชาชน }
                fileName: { type: string }
                url: { type: string, format: uri, description: ลิงก์จาก POST /uploads }
                expiresAt: { type: string, format: date }
                uploadedBy: { type: string, description: หลังบ้านใส่ให้ (ไม่ต้องส่ง) }
        PersonnelTraining:
            type: object
            required: [name, completedAt]
            properties:
                name: { type: string }
                completedAt: { type: string, format: date }
                expiresAt: { type: string, format: date }
        PersonnelSensitive:
            type: object
            description: ข้อมูลอ่อนไหว ส่งมาเฉพาะบทบาทที่มีสิทธิ์ (เจ้าของบริษัท บัญชี/การเงิน) บทบาทอื่นไม่มีฟิลด์นี้ และค่าที่ส่งเข้ามาจะถูกละเว้น
            properties:
                compensationType: { type: string, description: เงินเดือน / รายวัน / เหมางาน }
                compensationRate: { type: number }
                compensationHistory: { type: string }
                withholdingTaxTerms: { type: string }
                bankName: { type: string }
                bankAccountNumber: { type: string }
                bankAccountName: { type: string }
                taxpayerId: { type: string }
                withholdingCertificate: { type: string }
                performanceRating: { type: string }
                performanceNotes: { type: string }
        PersonnelInput:
            type: object
            description: ข้อมูลที่แก้ไขได้ในหน้าบุคลากร (วันที่ว่างให้ละฟิลด์ไว้)
            required: [fullName]
            properties:
                photoUrl: { type: string, description: ลิงก์จาก POST /uploads }
                fullName: { type: string, minLength: 1 }
                nationalId: { type: string }
                position: { type: string }
                birthDate: { type: string, format: date }
                hireDate: { type: string, format: date }
                endDate: { type: string, format: date }
                phone: { type: string }
                lineId: { type: string }
                email: { type: string }
                registeredAddress: { type: string }
                currentAddress: { type: string }
                emergencyContactName: { type: string }
                emergencyContactRelation: { type: string }
                emergencyContactPhone: { type: string }
                employmentType: { type: string, description: ประจำ / รายเดือน / รายวัน }
                department: { type: string }
                supervisor: { type: string }
                expertise: { type: string }
                workAreas: { type: string }
                availability: { type: string }
                education: { type: string }
                institution: { type: string }
                otherCertificates: { type: string }
                professionalLicenseNumber: { type: string }
                professionalLicenseType: { type: string }
                professionalLicenseLevel: { type: string }
                professionalLicenseExpiresAt: { type: string, format: date }
                workPermitExpiresAt: { type: string, format: date }
                socialSecurityNumber: { type: string }
                issuedEquipment: { type: string }
                documents:
                    type: array
                    items: { $ref: '#/components/schemas/PersonnelDocument' }
                trainings:
                    type: array
                    items: { $ref: '#/components/schemas/PersonnelTraining' }
                sensitive: { $ref: '#/components/schemas/PersonnelSensitive' }
        Personnel:
            allOf:
                - $ref: '#/components/schemas/PersonnelInput'
                - type: object
                  required: [id, employeeCode, projectHistory, auditHistory]
                  properties:
                      id: { type: string }
                      employeeCode: { type: string, description: หลังบ้านออกให้เมื่อเพิ่มบุคลากร, examples: [EMP690001] }
                      projectHistory:
                          type: array
                          description: หลังบ้านสร้างจากการมอบหมายงาน (อ่านอย่างเดียว)
                          items:
                              type: object
                              required: [projectCode, role, period, assignment, dailyReport]
                              properties:
                                  projectCode: { type: string }
                                  role: { type: string }
                                  period: { type: string }
                                  assignment: { type: string }
                                  dailyReport: { type: string }
                                  paidAmount: { type: number, description: ส่งมาเฉพาะบทบาทที่เห็นข้อมูลอ่อนไหว }
                      auditHistory:
                          type: array
                          description: ประวัติการแก้ไข (อ่านอย่างเดียว)
                          items:
                              type: object
                              required: [at, userName, action]
                              properties:
                                  at: { type: string, format: date-time }
                                  userName: { type: string }
                                  action: { type: string }
        LicenseAlert:
            type: object
            required: [personnelId, fullName, license, expiresAt, expired]
            properties:
                personnelId: { type: string }
                fullName: { type: string }
                license: { type: string }
                expiresAt: { type: string, format: date }
                expired: { type: boolean }

        # ---------- การอนุมัติ ----------
        ApprovalType:
            type: string
            enum: [pr, po, subcontract, change-order, petty-cash, rental]
        ApprovalStatus:
            type: string
            enum: [pending, approved, rejected]
        ApprovalLevel:
            type: string
            description: ผู้มีอำนาจอนุมัติตามเกณฑ์ (หลังบ้านคำนวณจากยอดและประเภท)
            enum: [project-manager, owner]
        ApprovalItem:
            type: object
            required: [name, quantity, unit, unitPrice]
            properties:
                name: { type: string }
                quantity: { type: number }
                unit: { type: string }
                unitPrice: { type: number }
        ApprovalStep:
            type: object
            required: [action, user, at]
            properties:
                action: { type: string, enum: [submitted, approved, rejected] }
                user: { $ref: '#/components/schemas/UserRef' }
                at: { type: string, format: date-time }
                note: { type: string }
        Approval:
            type: object
            required: [id, type, projectCode, title, amount, requestedBy, requestedAt, status, approvalLevel, items, history]
            properties:
                id: { type: string }
                type: { $ref: '#/components/schemas/ApprovalType' }
                projectCode: { type: string }
                title: { type: string }
                reason: { type: string }
                amount: { type: number, description: ยอดรวม = ผลรวม quantity × unitPrice }
                requestedBy: { $ref: '#/components/schemas/UserRef' }
                requestedAt: { type: string, format: date-time }
                status: { $ref: '#/components/schemas/ApprovalStatus' }
                approvalLevel: { $ref: '#/components/schemas/ApprovalLevel' }
                items:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovalItem' }
                history:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovalStep' }
                changeOrderId: { type: string, description: คำขอนี้มาจากงานเพิ่ม-ลดของโครงการ (อนุมัติแล้วหลังบ้านปรับมูลค่า/ไทม์ไลน์ให้) }
                purchaseId: { type: string, description: คำขอนี้มาจากใบขอซื้อของโครงการ (อนุมัติแล้วสั่งซื้อได้ที่แท็บจัดซื้อ/เช่า) }
                rentalId: { type: string, description: คำขอนี้มาจากการเช่าอุปกรณ์ของโครงการ }
        ApprovalPage:
            allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required: [items]
                  properties:
                      items:
                          type: array
                          items: { $ref: '#/components/schemas/Approval' }
        ApprovalSummary:
            type: object
            required: [pending, approved, rejected, pendingAmount, ownerPending]
            properties:
                pending: { type: integer }
                approved: { type: integer }
                rejected: { type: integer }
                pendingAmount: { type: number }
                ownerPending: { type: integer, description: รายการรอที่ต้องให้เจ้าของอนุมัติ }
        DecisionInput:
            type: object
            properties:
                note: { type: string, maxLength: 500 }
        RejectInput:
            type: object
            required: [note]
            properties:
                note: { type: string, minLength: 1, maxLength: 500 }
        BulkApproveResult:
            type: object
            required: [approved, skipped]
            properties:
                approved:
                    type: array
                    items: { $ref: '#/components/schemas/Approval' }
                skipped:
                    type: array
                    items:
                        type: object
                        required: [id, reason]
                        properties:
                            id: { type: string }
                            reason: { type: string }

        # ---------- Audit Log ----------
        AuditModule:
            type: string
            enum: [approval, project, personnel, procurement, finance, system]
        AuditEntry:
            type: object
            required: [id, at, user, module, action, target]
            properties:
                id: { type: string }
                at: { type: string, format: date-time }
                user: { $ref: '#/components/schemas/UserRef' }
                module: { $ref: '#/components/schemas/AuditModule' }
                action: { type: string, description: ข้อความการกระทำ (ภาษาไทย) }
                target: { type: string, description: เลขที่/รหัสของสิ่งที่ถูกกระทำ }
                detail: { type: string }
        AuditLogPage:
            allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required: [items]
                  properties:
                      items:
                          type: array
                          items: { $ref: '#/components/schemas/AuditEntry' }

        # ---------- Dashboard ----------
        ProjectHealth:
            type: string
            enum: [normal, behind, over-budget, loss]
        ProjectFinance:
            type: object
            required: [projectCode, customerName, contractValue, progress, plannedProgress, budgetCost, earnedRevenue, actualCost, grossProfit, margin, forecastProfit, cashReceived, receivable, health]
            properties:
                projectCode: { type: string }
                customerName: { type: string }
                contractValue: { type: number }
                progress: { type: integer }
                plannedProgress: { type: integer, description: ความคืบหน้าที่ควรเป็นตามเวลา }
                budgetCost: { type: number }
                earnedRevenue: { type: number, description: รายได้รับรู้ตามความคืบหน้า }
                actualCost: { type: number }
                grossProfit: { type: number }
                margin: { type: number, description: '% ของรายได้รับรู้' }
                forecastProfit: { type: number, description: กำไรที่คาดเมื่อจบโครงการ }
                cashReceived: { type: number }
                receivable: { type: number }
                health: { $ref: '#/components/schemas/ProjectHealth' }
        ProjectGroup:
            type: string
            description: |
                pending-contract = รอทำสัญญา, active = กำลังดำเนินการ (มีสัญญาแล้ว ยังไม่ส่งมอบ),
                in-hand = โครงการในมือ (รอทำสัญญา + กำลังดำเนินการ), completed = ส่งมอบแล้ว,
                warranty = ส่งมอบแล้วและยังมีการรับประกันอย่างน้อย 1 ส่วนที่ยังมีผล (งานโครงสร้างรับประกันนานที่สุด)
            enum: [in-hand, pending-contract, active, completed, warranty]
        WarrantyType:
            type: string
            description: architectural = งานสถาปัตยกรรม (1 ปี), structural = งานโครงสร้าง (5 ปี)
            enum: [architectural, structural]
        WarrantyTerm:
            type: object
            description: เงื่อนไขการรับประกันผลงานหลังส่งมอบของบริษัท
            required: [type, label, months, scope]
            properties:
                type: { $ref: '#/components/schemas/WarrantyType' }
                label: { type: string, examples: [งานโครงสร้าง] }
                months: { type: integer, description: ระยะรับประกันนับจากวันส่งมอบ (เดือน) }
                scope: { type: string, description: ขอบเขตงานที่รับประกัน }
        WarrantyCoverage:
            description: การรับประกันแต่ละส่วนของโครงการที่ส่งมอบแล้ว
            allOf:
                - $ref: '#/components/schemas/WarrantyTerm'
                - type: object
                  required: [startDate, endDate, daysLeft, active]
                  properties:
                      startDate: { type: string, format: date, description: วันส่งมอบ }
                      endDate: { type: string, format: date, description: วันสุดท้ายที่รับประกัน }
                      daysLeft: { type: integer, description: จำนวนวันที่เหลือ (ติดลบ = หมดประกันแล้ว) }
                      active: { type: boolean }
        ProjectPortfolio:
            type: object
            required: [asOf, warrantyTerms, counts, activeByStatus, warranties]
            properties:
                asOf: { type: string, format: date-time }
                warrantyTerms:
                    type: array
                    items: { $ref: '#/components/schemas/WarrantyTerm' }
                counts:
                    type: object
                    required: [total, inHand, pendingContract, active, completed, warranty]
                    properties:
                        total: { type: integer }
                        inHand: { type: integer }
                        pendingContract: { type: integer }
                        active: { type: integer }
                        completed: { type: integer }
                        warranty: { type: integer }
                activeByStatus:
                    type: object
                    description: แยกโครงการที่กำลังดำเนินการตามสถานะ
                    required: [planning, in-progress, near-handover, delayed]
                    properties:
                        planning: { type: integer }
                        in-progress: { type: integer }
                        near-handover: { type: integer }
                        delayed: { type: integer }
                inHandValue: { type: number, description: มูลค่าสัญญาของโครงการที่กำลังดำเนินการ (เฉพาะสิทธิ์ finance.company) }
                warranties:
                    type: array
                    description: โครงการที่ยังอยู่ในประกัน เรียงตามการรับประกันที่ใกล้หมดที่สุด (warrantyUntil/daysLeft/expiringType = ส่วนที่ยังมีผลและจะหมดก่อน)
                    items:
                        type: object
                        required: [code, name, customerName, handedOverAt, warrantyUntil, daysLeft, expiringType, coverages]
                        properties:
                            code: { type: string }
                            name: { type: string }
                            customerName: { type: string }
                            handedOverAt: { type: string, format: date }
                            warrantyUntil: { type: string, format: date }
                            daysLeft: { type: integer }
                            expiringType: { $ref: '#/components/schemas/WarrantyType' }
                            coverages:
                                type: array
                                items: { $ref: '#/components/schemas/WarrantyCoverage' }
        DashboardSummary:
            type: object
            required: [asOf, totals, projects]
            properties:
                asOf: { type: string, format: date-time }
                totals:
                    type: object
                    required: [contractValue, backlog, activeProjects, earnedRevenue, actualCost, grossProfit, margin, forecastProfit, cashReceived, receivable]
                    properties:
                        contractValue: { type: number }
                        backlog: { type: number }
                        activeProjects: { type: integer }
                        earnedRevenue: { type: number }
                        actualCost: { type: number }
                        grossProfit: { type: number }
                        margin: { type: number }
                        forecastProfit: { type: number }
                        cashReceived: { type: number }
                        receivable: { type: number }
                projects:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectFinance' }
        MonthlyCashFlow:
            type: object
            required: [month, cashIn, cashOut]
            properties:
                month: { type: string, description: YYYY-MM, examples: ['2026-10'] }
                cashIn: { type: number }
                cashOut: { type: number }
