            operationId: getProjectHouse
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProjectHouse' }
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [projects]
            summary: บันทึกข้อมูลแบบบ้านของโครงการ (ต้องมีสิทธิ์ project.manage)
            operationId: saveProjectHouse
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ProjectHouseInput' }
            responses:
                '200':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProjectHouse' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

