                '404': { $ref: '#/components/responses/NotFound' }
        post:
            tags: [projects]
            summary: อัปโหลดแบบบ้าน 3 มิติเวอร์ชันใหม่ (ต้องมีสิทธิ์ project.manage)
            operationId: createProjectModel
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ProjectModelInput' }
            responses:
                '201':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProjectModel' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/house:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
