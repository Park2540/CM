            summary: ถอด BOQ และรายการวัสดุจากโมเดล IFC ของโครงการ (สิทธิ์ estimate.manage) — สร้าง BOQ ฉบับร่าง
            description: |
                ใช้ปริมาณในไฟล์ (BaseQuantities) ถ้ามี ไม่มีคำนวณจากรูปทรง: คอนกรีต (ลบ.ม.) ไม้แบบ (ตร.ม. ผิวข้าง/ล่าง) เหล็กเสริม (กก. จากแนวเหล็ก)
                เหล็กรูปพรรณ (กก. = ปริมาตร × 7,850) แผ่นพื้นสำเร็จ (ตร.ม.) เสาเข็ม (ต้น) หลังคา (ตร.ม.) — ราคาต่อหน่วยจากคลังราคา
            operationId: createEstimateFromModel
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EstimateFromModelInput' } } } }
