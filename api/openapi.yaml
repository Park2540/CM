openapi: 3.1.0
info:
    title: PP Prime Construction API
    version: 0.1.0
    description: |
        สัญญา API ระหว่างหน้าบ้าน (Angular) และหลังบ้านของระบบบริหารงานก่อสร้าง PP Prime Construction

        หลักการ
        - เงินเป็นบาท (number) ทศนิยมได้ 2 ตำแหน่ง
        - วันที่ตามแผนใช้ `date` (YYYY-MM-DD) เวลาที่เกิดเหตุการณ์ใช้ `date-time` (ISO 8601 พร้อมเขตเวลา)
        - สถานะ/ประเภทเป็นรหัสภาษาอังกฤษ หน้าบ้านแปลเป็นข้อความไทยเอง
        - ข้อผิดพลาดตอบเป็น `application/problem+json` (RFC 9457)
        - การคำนวณทางธุรกิจ (ระดับผู้อนุมัติ กำไร-ขาดทุน ไทม์ไลน์ สถานะงวด) ทำที่หลังบ้าน
        - ทุกการเปลี่ยนแปลงข้อมูล หลังบ้านต้องบันทึก Audit Log เอง (หน้าบ้านไม่มี API เขียน Audit Log)
        - สิทธิ์การเข้าถึงตรวจที่หลังบ้านตามบทบาทใน `GET /roles`; ข้อมูลที่บทบาทนั้นไม่มีสิทธิ์เห็นต้องไม่ถูกส่งมา
servers:
    - url: /api
      description: ค่าเริ่มต้น (หน้าบ้านตั้ง apiBaseUrl ได้)
security:
    - bearerAuth: []
tags:
    - name: auth
      description: ผู้ใช้และสิทธิ์
    - name: users
      description: บัญชีผู้ใช้ของบุคลากร บทบาท และสิทธิ์รายคน
    - name: settings
    - name: projects
    - name: personnel
    - name: subcontractors
      description: ทะเบียนผู้รับเหมาช่วงและการมอบหมายรายโครงการ
    - name: approvals
    - name: audit
    - name: dashboard

paths:
    /auth/login:
        post:
            tags: [auth]
            summary: เข้าสู่ระบบด้วยอีเมลและรหัสผ่าน — ได้ access token (Bearer) สำหรับทุกคำขอ
            description: |
                - อีเมลหรือรหัสผ่านไม่ถูกต้อง → 401 (ข้อความเดียวกัน ไม่บอกว่าผิดช่องไหน)
                - รหัสผ่านถูกแต่ยังเข้าใช้ไม่ได้ → 403 โดย title บอกเหตุผล: คำขอสมัครรออนุมัติ, คำขอสมัครถูกปฏิเสธ (detail = เหตุผล), บัญชีถูกระงับ, ยังไม่ได้ตั้งรหัสผ่านจากคำเชิญ
                - ผิดติดกัน 5 ครั้งต่ออีเมล → 429 ล็อก 15 นาที
                - lastLoginAt ใน user คือเวลาเข้าสู่ระบบครั้งก่อนหน้า (ก่อนครั้งนี้)
            operationId: login
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/LoginInput' }
            responses:
                '200':
                    description: เข้าสู่ระบบแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/LoginResult' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }
                '429':
                    description: พยายามเข้าสู่ระบบผิดหลายครั้ง
                    content:
                        application/problem+json:
                            schema: { $ref: '#/components/schemas/Problem' }

    /auth/me:
        get:
            tags: [auth]
            summary: ผู้ใช้ที่ล็อกอินอยู่
            operationId: getCurrentUser
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/CurrentUser' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /auth/logout:
        post:
            tags: [auth]
            summary: ออกจากระบบ (ยกเลิก token ปัจจุบัน)
            operationId: logout
            responses:
                '204':
                    description: ออกจากระบบแล้ว

    /auth/register:
        post:
            tags: [auth]
            summary: สมัครสมาชิก (ไม่ต้องล็อกอิน) — ได้คำขอสถานะ pending เข้าระบบได้หลังแอดมินหรือเจ้าของบริษัทอนุมัติเท่านั้น
            description: |
                หลังบ้านต้องปฏิเสธการเข้าสู่ระบบของผู้ที่คำขอยังไม่ได้รับอนุมัติ
                อีเมลที่มีบัญชีอยู่แล้วหรือมีคำขอรออนุมัติอยู่ ตอบ 409
            operationId: register
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/RegistrationInput' }
            responses:
                '202':
                    description: รับคำขอแล้ว รออนุมัติ
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [id, status, submittedAt]
                                properties:
                                    id: { type: string }
                                    status: { type: string, const: pending }
                                    submittedAt: { type: string, format: date-time }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /registrations:
        get:
            tags: [users]
            summary: คำขอสมัครสมาชิก (ต้องมีสิทธิ์ user.manage)
            operationId: listRegistrations
            parameters:
                - { name: status, in: query, schema: { $ref: '#/components/schemas/RegistrationStatus' } }
            responses:
                '200':
                    description: OK (ใหม่สุดก่อน)
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/Registration' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /registrations/{id}/approve:
        parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [users]
            summary: อนุมัติคำขอและสร้างบัญชี (สถานะ active) — เฉพาะบทบาทแอดมินหรือเจ้าของบริษัท (403)
            description: ผูกกับบุคลากรในทะเบียน (ยังไม่มีบัญชี) และกำหนดบทบาท/สิทธิ์ตามกฎเดียวกับ POST /user-accounts คำขอที่ไม่ใช่ pending ตอบ 409
            operationId: approveRegistration
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/UserAccountInput'
                                - type: object
                                  required: [personnelId]
                                  properties:
                                      personnelId: { type: string }
            responses:
                '200':
                    description: อนุมัติแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserAccount' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /registrations/{id}/reject:
        parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [users]
            summary: ปฏิเสธคำขอ (ต้องระบุเหตุผล) — เฉพาะบทบาทแอดมินหรือเจ้าของบริษัท (403)
            operationId: rejectRegistration
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [reason]
                            properties:
                                reason: { type: string, minLength: 1 }
            responses:
                '200':
                    description: ปฏิเสธแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Registration' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /users:
        get:
            tags: [auth]
            summary: รายชื่อผู้ใช้ (ใช้ในตัวกรอง)
            operationId: listUsers
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/UserRef' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /roles:
        get:
            tags: [auth]
            summary: บทบาทและสิทธิ์ทั้งหมด
            operationId: listRoles
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/RoleCatalog' }

    /user-accounts:
        get:
            tags: [users]
            summary: บัญชีผู้ใช้ของบุคลากร (ต้องมีสิทธิ์ user.manage)
            operationId: listUserAccounts
            parameters:
                - { name: q, in: query, description: ค้นหาชื่อ รหัสบุคลากร อีเมล, schema: { type: string } }
                - { name: roleId, in: query, schema: { $ref: '#/components/schemas/RoleId' } }
                - { name: status, in: query, schema: { $ref: '#/components/schemas/UserAccountStatus' } }
                - { name: personnelId, in: query, description: บัญชีของบุคลากรคนนี้ (มีได้ไม่เกิน 1), schema: { type: string } }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/UserAccount' }
                '403': { $ref: '#/components/responses/Forbidden' }
        post:
            tags: [users]
            summary: สร้างบัญชีให้บุคลากรและส่งคำเชิญตั้งรหัสผ่านทางอีเมล (สถานะเริ่มต้น invited)
            operationId: createUserAccount
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/UserAccountCreateInput' }
            responses:
                '201':
                    description: สร้างแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserAccount' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /user-accounts/{id}:
        parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
        put:
            tags: [users]
            summary: แก้บทบาท โครงการ และสิทธิ์รายคน — แก้บทบาทหรือถอน user.manage ของตัวเองไม่ได้ (409)
            operationId: updateUserAccount
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/UserAccountInput' }
            responses:
                '200':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserAccount' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /user-accounts/{id}/suspend:
        parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [users]
            summary: ระงับบัญชี (ออกจากระบบทุกอุปกรณ์ทันที) — ระงับตัวเองหรือเจ้าของบริษัทคนสุดท้ายไม่ได้ (409)
            operationId: suspendUserAccount
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                reason: { type: string, description: เหตุผล (บันทึกใน Audit Log) }
            responses:
                '200':
                    description: ระงับแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserAccount' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /user-accounts/{id}/activate:
        parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [users]
            summary: เปิดใช้บัญชีที่ระงับไว้ (กลับเป็น active หรือ invited ถ้ายังไม่เคยตั้งรหัสผ่าน)
            operationId: activateUserAccount
            responses:
                '200':
                    description: เปิดใช้แล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserAccount' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /user-accounts/{id}/reset-password:
        parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [users]
            summary: ส่งลิงก์ตั้งรหัสผ่านใหม่ทางอีเมล (บัญชี invited = ส่งคำเชิญซ้ำ) — บัญชีที่ระงับอยู่ทำไม่ได้ (409)
            operationId: resetUserPassword
            responses:
                '200':
                    description: ส่งแล้ว (invitedAt เปลี่ยนเป็นเวลาล่าสุด)
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserAccount' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /settings/approval:
        get:
            tags: [settings]
            summary: เกณฑ์การอนุมัติ
            operationId: getApprovalSettings
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ApprovalSettings' }
        put:
            tags: [settings]
            summary: แก้ไขเกณฑ์การอนุมัติ (แอดมิน/เจ้าของบริษัท)
            operationId: updateApprovalSettings
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ApprovalSettings' }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ApprovalSettings' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects:
        get:
            tags: [projects]
            summary: รายการโครงการที่ผู้ใช้มีสิทธิ์เห็น
            operationId: listProjects
            parameters:
                - { name: status, in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
                - { name: group, in: query, description: กลุ่มโครงการ (ดู ProjectGroup), schema: { $ref: '#/components/schemas/ProjectGroup' } }
                - { name: q, in: query, description: ค้นหารหัส ชื่อลูกค้า ผู้รับผิดชอบ, schema: { type: string } }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/Project' }
        post:
            tags: [projects]
            summary: เปิดโครงการใหม่ (ต้องมีสิทธิ์ project.create)
            description: |
                หลังบ้านออกรหัสโครงการ (รหัสภูมิภาค + ปี พ.ศ. 2 หลัก + ลำดับ 4 หลัก เช่น CR690003) และบันทึก Audit Log
                โครงการใหม่มีสถานะ pending-contract (ยังไม่มีมูลค่า วันที่ และแผนงาน จนกว่าจะบันทึกสัญญาและตั้งค่างานก่อสร้าง)
            operationId: createProject
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ProjectInput' }
            responses:
                '201':
                    description: เปิดโครงการแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Project' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /settings/project-regions:
        get:
            tags: [settings]
            summary: รหัสภูมิภาคที่ใช้ขึ้นต้นรหัสโครงการ
            operationId: listProjectRegions
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/ProjectRegion' }

    /settings/construction-options:
        get:
            tags: [settings]
            summary: ตัวเลือกในหน้าตั้งค่างานก่อสร้าง (ประเภทอาคาร ฐานราก ระบบพิเศษ ฯลฯ)
            description: |
                หน้าบ้านสร้างฟอร์มจากรายการนี้ทั้งหมด เพิ่มตัวเลือกใหม่ที่หลังบ้านได้โดยไม่ต้องแก้หน้าบ้าน
                งานที่ต้องทำของแต่ละตัวเลือกกำหนดที่หลังบ้าน (แม่แบบแผนงาน)
            operationId: listConstructionOptions
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/ConstructionOptionGroup' }

    /house-plans:
        get:
            tags: [projects]
            summary: แบบบ้านทั้งหมดที่เลือกได้ตอนเปิดโครงการ
            operationId: listHousePlans
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/HousePlan' }

    /projects/{code}:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [projects]
            operationId: getProject
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Project' }
                '404': { $ref: '#/components/responses/NotFound' }

    /projects/{code}/contract:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        post:
            tags: [projects]
            summary: บันทึกสัญญาและเริ่มแผนงาน (ต้องมีสิทธิ์ project.manage)
            description: |
                ใช้กับโครงการสถานะ pending-contract เท่านั้น
                หลังบ้านบันทึกมูลค่า/วันที่ สร้างแผนงานจากแม่แบบให้พอดีกับวันเริ่ม-วันส่งมอบ สร้างงวดงาน เปลี่ยนสถานะเป็น planning และบันทึก Audit Log
                ไทม์ไลน์ยังไม่ถูกสร้างจนกว่าจะตั้งค่างานก่อสร้าง (PUT /projects/{code}/setup)
                endpoint ข้อมูลรายโครงการ (timeline, installments, photos, documents, team, updates, inspection) ตอบ 409 จนกว่าจะบันทึกสัญญาและตั้งค่างานก่อสร้าง
            operationId: recordProjectContract
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ContractInput' }
            responses:
                '200':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Project' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/site-location:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        put:
            tags: [projects]
            summary: ปักหมุดพิกัดหน้างาน (ต้องมีสิทธิ์ project.manage) — ใช้แสดงแผนที่และปุ่มนำทาง Google Maps
            operationId: setProjectSiteLocation
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SiteLocationInput' } } } }
            responses:
                '200': { description: บันทึกแล้ว, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }
        delete:
            tags: [projects]
            summary: ลบหมุดพิกัดหน้างาน (กลับไปค้นหาจากที่ตั้งหน้างาน) — สิทธิ์ project.manage
            operationId: clearProjectSiteLocation
            responses:
                '200': { description: ลบแล้ว, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }

    /projects/{code}/setup:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [projects]
            summary: การตั้งค่างานก่อสร้างของโครงการ
            description: ยังไม่ตั้งค่า → configured = false และ options เป็นค่าเริ่มต้น; 409 ถ้ายังไม่บันทึกสัญญา
            operationId: getProjectSetup
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProjectSetup' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
        put:
            tags: [projects]
            summary: บันทึกการตั้งค่างานก่อสร้างและสร้างไทม์ไลน์ (ต้องมีสิทธิ์ project.manage)
            description: |
                หลังบ้านคัดงานจากแม่แบบตามตัวเลือก จัดวันที่ให้พอดีกับระยะสัญญา สร้างไทม์ไลน์และงวดงานใหม่ (ตามสัดส่วน paymentPercents) และบันทึก Audit Log
                ตัวเลือกที่ถูกซ่อน (visibleWhen ไม่ตรง) หลังบ้านปรับเป็นค่าเริ่มต้นเอง
                409 ถ้ายังไม่บันทึกสัญญา หรือเริ่มรายงานความคืบหน้าแล้ว (locked)
            operationId: saveProjectSetup
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ProjectSetupInput' }
            responses:
                '200':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProjectSetup' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/setup/preview:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        post:
            tags: [projects]
            summary: ดูตัวอย่างงานที่จะเกิดขึ้นจากตัวเลือก (ไม่บันทึก)
            operationId: previewProjectSetup
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ProjectSetupInput' }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/SetupPreview' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/timeline:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [projects]
            summary: ไทม์ไลน์ตามแผนงานพร้อมความคืบหน้ารายงาน
            operationId: getProjectTimeline
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProjectTimeline' }
                '404': { $ref: '#/components/responses/NotFound' }

    /projects/{code}/updates:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [projects]
            summary: บันทึกหน้างาน/ประวัติการอัปเดตความคืบหน้า (ล่าสุดก่อน)
            operationId: listProgressUpdates
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProgressUpdatePage' }
                '404': { $ref: '#/components/responses/NotFound' }
        post:
            tags: [projects]
            summary: บันทึกความคืบหน้าประจำวัน
            description: |
                หลังบ้านปรับ % ของงานที่ระบุ แล้วคำนวณ % ของขั้นตอนและภาพรวมโครงการใหม่ (ถ่วงน้ำหนักตามจำนวนวันของงาน)
                หมุดหมาย (milestone) เสร็จอัตโนมัติเมื่องานอื่นในขั้นตอนเสร็จครบ
                งานที่เป็นจุดตรวจ (Hold Point) อัปเดตผ่าน endpoint นี้ไม่ได้ ต้องใช้ /inspection
                การลด % ต้องระบุเหตุผลใน note
            operationId: createProgressUpdate
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ProgressUpdateInput' }
            responses:
                '201':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProgressUpdate' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/tasks/{taskCode}/inspection:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: taskCode, in: path, required: true, schema: { type: string, examples: ['05.04'] } }
        post:
            tags: [projects]
            summary: บันทึกผลตรวจจุด Hold Point (ผ่าน = งานเสร็จ, ไม่ผ่าน = ต้องแก้ไขและตรวจใหม่)
            operationId: recordInspection
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/InspectionInput' }
            responses:
                '201':
                    description: บันทึกแล้ว (คืนรายการบันทึกหน้างานที่สร้างขึ้น)
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProgressUpdate' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /uploads:
        post:
            tags: [projects]
            summary: อัปโหลดไฟล์ (รูปหน้างาน) แล้วนำ id ไปอ้างอิงในบันทึก
            operationId: uploadFile
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file]
                            properties:
                                file: { type: string, format: binary, description: 'รูป (JPG/PNG/WebP) หรือเอกสาร (PDF, Excel, Word, DWG) ไม่เกิน 10 MB — แบบ 3 มิติ (GLB, glTF, DAE, FBX, OBJ, SKP, RVT) ไม่เกิน 200 MB — รูปหน้างาน (photoIds) ต้องเป็นรูปเท่านั้น' }
            responses:
                '201':
                    description: อัปโหลดแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UploadedFile' }
                '413': { $ref: '#/components/responses/ValidationError' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/change-orders:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [projects]
            summary: งานเพิ่ม-ลดของโครงการ (ล่าสุดก่อน)
            operationId: listChangeOrders
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/ChangeOrder' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
        post:
            tags: [projects]
            summary: ขอเพิ่ม-ลดงาน (ต้องมีสิทธิ์ project.manage) — สร้างคำขออนุมัติประเภท change-order ในศูนย์อนุมัติ
            description: |
                อนุมัติ/ไม่อนุมัติผ่าน POST /approvals/{approvalId}/approve|reject เมื่ออนุมัติ หลังบ้าน:
                - บวกยอดสุทธิเข้า changeOrderTotal ของโครงการ และเพิ่มงวดงานของงานเพิ่ม-ลด
                - เลื่อนกำหนดส่งมอบตาม scheduleImpactDays
                - เพิ่ม newTask เข้าไทม์ไลน์ (ท้ายขั้นตอนที่ระบุ ก่อนหมุดหมาย)
                งานที่ลูกค้าขอ (source = customer) อนุมัติไม่ได้จนกว่าลูกค้าจะยืนยัน (409)
            operationId: createChangeOrder
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/ChangeOrderInput' }
            responses:
                '201':
                    description: ส่งขออนุมัติแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ChangeOrder' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/change-orders/{id}/customer-confirm:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [projects]
            summary: บันทึกว่าลูกค้ายืนยันรายการและราคาแล้ว (คำขอที่ยังรออนุมัติ)
            operationId: confirmChangeOrderByCustomer
            responses:
                '200':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ChangeOrder' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /projects/{code}/change-orders/{id}/cancel:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [projects]
            summary: ยกเลิกคำขอที่ยังรออนุมัติ (คำขออนุมัติที่ผูกไว้ถูกปิดด้วย)
            operationId: cancelChangeOrder
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                reason: { type: string }
            responses:
                '200':
                    description: ยกเลิกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ChangeOrder' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /projects/{code}/installments:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [projects]
            summary: งวดงานและการชำระเงินของลูกค้า
            operationId: listProjectInstallments
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/Installment' }
                '404': { $ref: '#/components/responses/NotFound' }

    /projects/{code}/purchases:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [procurement]
            summary: ใบขอซื้อวัสดุของโครงการ (ล่าสุดก่อน)
            operationId: listPurchases
            responses:
                '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PurchaseRequest' } } } } }
                '404': { $ref: '#/components/responses/NotFound' }
        post:
            tags: [procurement]
            summary: ขอซื้อวัสดุ (สิทธิ์ progress.update / project.manage / procurement.manage) — ส่งเข้าศูนย์อนุมัติเป็นใบขอซื้อ (pr)
            description: โครงการต้องบันทึกสัญญาแล้ว (ไม่เช่นนั้น 409) · phaseCode ต้องมีในไทม์ไลน์ของโครงการ
            operationId: createPurchase
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequestInput' } } } }
            responses:
                '201': { description: บันทึกแล้ว, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequest' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/purchases/{id}/order:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [procurement]
            summary: ออกใบสั่งซื้อ (ใบขอซื้อต้องอนุมัติแล้ว) ส่งเข้าศูนย์อนุมัติเป็น po — สิทธิ์ procurement.manage
            operationId: orderPurchase
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseOrderInput' } } } }
            responses:
                '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequest' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/purchases/{id}/receive:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [procurement]
            summary: ตรวจรับของที่หน้างาน (ทยอยรับได้หลายครั้ง ใบสั่งซื้อต้องอนุมัติแล้ว) — สิทธิ์ procurement.receive / procurement.manage
            operationId: receivePurchase
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseReceiveInput' } } } }
            responses:
                '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequest' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/purchases/{id}/cancel:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: id, in: path, required: true, schema: { type: string } }
        post:
            tags: [procurement]
            summary: ยกเลิกใบขอซื้อ (ก่อนรับของ) — ผู้ขอ หรือสิทธิ์ procurement.manage / project.manage
            operationId: cancelPurchase
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CancelInput' } } } }
            responses:
                '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseRequest' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/boq:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [procurement]
            summary: BOQ วัสดุของโครงการ
            operationId: getProjectBoq
            responses:
                '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectBoq' } } } }
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [procurement]
            summary: บันทึก BOQ ทั้งชุด (สิทธิ์ project.manage)
            operationId: saveProjectBoq
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectBoqInput' } } } }
            responses:
                '200': { description: บันทึกแล้ว, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectBoq' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/material-usage:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [procurement]
            summary: เทียบวัสดุที่ใช้จริง (รับ + เบิกคลัง − ส่งคืนคลัง) กับ BOQ รายวัสดุ
            operationId: getMaterialUsage
            responses:
                '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialUsage' } } } }
                '404': { $ref: '#/components/responses/NotFound' }

    /projects/{code}/stock-movements:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [procurement]
            summary: ของเหลือส่งเข้าคลังหลัก / เบิกจากคลังหลัก ของโครงการ (ล่าสุดก่อน)
            operationId: listProjectStockMovements
            responses:
                '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StockMovement' } } } } }
                '404': { $ref: '#/components/responses/NotFound' }
        post:
            tags: [procurement]
            summary: บันทึกส่งของเหลือเข้าคลังหลัก หรือเบิกจากคลังหลัก (สิทธิ์ procurement.receive / procurement.manage)
            description: เบิกได้ไม่เกินยอดคงเหลือในคลังหลัก · ส่งคืนได้ไม่เกินที่ใช้จริงของโครงการ
            operationId: createStockMovement
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementInput' } } } }
            responses:
                '201': { description: บันทึกแล้ว, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovement' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /warehouse/stock:
        get:
            tags: [procurement]
            summary: ยอดคงเหลือในคลังหลักของบริษัท รายวัสดุ
            operationId: listWarehouseStock
            responses:
                '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StockBalance' } } } } }

    /warehouse/movements:
        get:
            tags: [procurement]
            summary: ประวัติการรับเข้า/เบิกออกคลังหลัก ทุกโครงการ (ล่าสุดก่อน)
            operationId: listWarehouseMovements
            responses:
                '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StockMovement' } } } } }

    /materials:
        get:
            tags: [procurement]
            summary: รายการวัสดุของบริษัท
            operationId: listMaterials
            responses:
                '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Material' } } } } }
        post:
            tags: [procurement]
            summary: เพิ่มวัสดุ (สิทธิ์ procurement.manage / project.manage)
            operationId: createMaterial
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialInput' } } } }
            responses:
                '201': { description: บันทึกแล้ว, content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } }
                '403': { $ref: '#/components/responses/Forbidden' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /materials/{materialCode}:
        parameters:
            - { name: materialCode, in: path, required: true, schema: { type: string } }
        put:
            tags: [procurement]
            summary: แก้ไขวัสดุ (สิทธิ์ procurement.manage / project.manage) — active = false เพื่อเลิกใช้
            operationId: updateMaterial
            requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialInput' } } } }
            responses:
