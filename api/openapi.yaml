            tags: [estimates]
            summary: BOQ พร้อมยอดรวม
            operationId: getEstimate
            responses:
                '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Estimate' } } } }
                '404': { $ref: '#/components/responses/NotFound' }
        put:
            tags: [estimates]
            summary: บันทึก BOQ ทั้งฉบับ (สิทธิ์ estimate.manage) — หลังบ้านคำนวณปริมาณจากการถอดและยอดรวมใหม่
