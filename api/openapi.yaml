                งวดจะเป็น paid ทันที และหลักฐานจะแสดงในเอกสารของโครงการหมวด billing
                ยอดรับ + ภาษีหัก ณ ที่จ่าย ต้องไม่เกินยอดงวด ถ้าน้อยกว่าต้องระบุเหตุผลใน note
