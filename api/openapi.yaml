            operationId: listProjectPhotos
            parameters:
                - { name: phaseCode, in: query, schema: { type: string } }
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/SitePhotoPage' }
                '404': { $ref: '#/components/responses/NotFound' }

    /projects/{code}/documents:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [projects]
            operationId: listProjectDocuments
            parameters:
                - { name: category, in: query, schema: { $ref: '#/components/schemas/DocumentCategory' } }
                - { name: q, in: query, schema: { type: string } }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/ProjectDocument' }
                '404': { $ref: '#/components/responses/NotFound' }

    /projects/{code}/assignments:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [subcontractors]
            summary: ผู้รับผิดชอบ (บุคลากร) และผู้รับเหมาช่วงของโครงการ
            description: ความคืบหน้า/สถานะของผู้รับเหมาช่วง หลังบ้านคำนวณจากขั้นตอนที่มอบหมายในไทม์ไลน์; contractValue ส่งเฉพาะผู้มีสิทธิ์ project.manage
            operationId: getProjectAssignments
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ProjectAssignments' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /projects/{code}/staff:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        post:
            tags: [subcontractors]
            summary: มอบหมายบุคลากรเป็นผู้รับผิดชอบในโครงการ (ต้องมีสิทธิ์ project.manage)
            description: ผู้จัดการโครงการคนแรกในรายการคือ responsibleName ของโครงการ (หลังบ้านอัปเดตให้); คนเดิมซ้ำในบทบาทเดิมตอบ 409
            operationId: addProjectStaff
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/StaffAssignmentInput' }
            responses:
                '201':
                    description: เพิ่มแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/StaffAssignment' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/staff/{assignmentId}:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: assignmentId, in: path, required: true, schema: { type: string } }
        put:
            tags: [subcontractors]
            summary: แก้บทบาท/หมายเหตุของผู้รับผิดชอบ
            operationId: updateProjectStaff
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/StaffAssignmentInput' }
            responses:
                '200':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/StaffAssignment' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }
        delete:
            tags: [subcontractors]
            summary: นำผู้รับผิดชอบออกจากโครงการ — โครงการต้องมีผู้จัดการโครงการอย่างน้อย 1 คน (409)
            operationId: removeProjectStaff
            responses:
                '204': { description: นำออกแล้ว }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /projects/{code}/subcontractors:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        post:
            tags: [subcontractors]
            summary: มอบหมายผู้รับเหมาช่วงตามขั้นตอนงาน (ต้องมีสิทธิ์ project.manage)
            description: ต้องตั้งค่างานก่อสร้างแล้ว (ใช้ขั้นตอนจากไทม์ไลน์); ผู้รับเหมาที่ปิดใช้งานมอบหมายไม่ได้ (422); ผู้รับเหมารายเดิมซ้ำในโครงการเดียวกันตอบ 409 (ให้แก้ไขรายการเดิม)
            operationId: addProjectSubcontractor
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/SubcontractorAssignmentInput' }
            responses:
                '201':
                    description: มอบหมายแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/SubcontractorAssignment' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/subcontractors/{assignmentId}:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
            - { name: assignmentId, in: path, required: true, schema: { type: string } }
        put:
            tags: [subcontractors]
            summary: แก้ขอบเขตงาน ขั้นตอน มูลค่าจ้าง
            operationId: updateProjectSubcontractor
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/SubcontractorAssignmentInput' }
            responses:
                '200':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/SubcontractorAssignment' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }
        delete:
            tags: [subcontractors]
            summary: ยกเลิกการมอบหมาย — ลบไม่ได้เมื่อขั้นตอนที่รับผิดชอบเริ่มงานแล้ว (409) ให้แก้ไขแทน
            operationId: removeProjectSubcontractor
            responses:
                '204': { description: ยกเลิกแล้ว }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }

    /subcontractors:
        get:
            tags: [subcontractors]
            summary: ทะเบียนผู้รับเหมาช่วง
            operationId: listSubcontractors
            parameters:
                - { name: q, in: query, description: ค้นหาชื่อ รหัส ผู้ติดต่อ, schema: { type: string } }
                - { name: trade, in: query, schema: { $ref: '#/components/schemas/SubcontractorTrade' } }
                - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/Subcontractor' }
        post:
            tags: [subcontractors]
            summary: เพิ่มผู้รับเหมาช่วง (ต้องมีสิทธิ์ project.manage) — หลังบ้านออกรหัส SUB-xxx
            operationId: createSubcontractor
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/SubcontractorInput' }
            responses:
                '201':
                    description: เพิ่มแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Subcontractor' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /subcontractors/{id}:
        parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
        put:
            tags: [subcontractors]
            summary: แก้ไขข้อมูลผู้รับเหมาช่วง / เปิด-ปิดใช้งาน
            operationId: updateSubcontractor
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/SubcontractorInput' }
            responses:
                '200':
                    description: บันทึกแล้ว
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Subcontractor' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/Conflict' }
                '422': { $ref: '#/components/responses/ValidationError' }

    /projects/{code}/team:
        parameters:
            - $ref: '#/components/parameters/ProjectCode'
        get:
            tags: [projects]
            summary: รายชื่อติดต่อทีมงานโครงการ (สร้างจากผู้รับผิดชอบที่มอบหมายใน /assignments)
            operationId: listProjectTeam
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items: { $ref: '#/components/schemas/TeamMember' }
                '404': { $ref: '#/components/responses/NotFound' }

    /house-plans/{code}:
        parameters:
            - { name: code, in: path, required: true, schema: { type: string } }
        get:
            tags: [projects]
